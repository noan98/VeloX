[package]
name = "velox"
version = "0.1.0"
edition = "2021"
description = "A fast, lightweight web browser built with Rust."
license = "MIT"
repository = "https://github.com/noan98/VeloX"
rust-version = "1.77"

[dependencies]
# Window creation and event loop (cross-platform: macOS / Linux / Windows).
tao = "0.37"
# Typed deserialization of toolbar IPC messages.
serde = { version = "1", features = ["derive"] }
# JSON wire format for toolbar IPC and safe JS string escaping.
serde_json = "1"
# URL parsing and normalization of address bar input.
url = "2"
# Decodes the embedded window icon (assets/icon/velox-128.png) into the raw
# RGBA pixels `tao::window::Icon` wants. Pure Rust, no system deps (see
# docs/decisions.md D52).
png = "0.18"

# WebView embedding (WebKitGTK on Linux, WKWebView on macOS, WebView2 on
# Windows). Split by target because devtools availability differs by
# platform (see docs/decisions.md D18):
# - macOS: the in-page inspector needs a private WebKit API, so wry only
#   compiles `WebView::open_devtools` when `debug_assertions` is set. We do
#   not add the `devtools` feature here, keeping release builds private-API
#   free (App Store safe) and devtools debug-only, matching wry's own gate.
# - everywhere else: no such constraint, so `devtools` is enabled
#   unconditionally (debug and release both get it).
[target.'cfg(not(target_os = "macos"))'.dependencies]
wry = { version = "0.56", features = ["devtools"] }

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.56"

# wry's gtk backend exposes raw gtk containers; we need the gtk crate to place
# two webviews (toolbar + content) inside one window on Linux/BSD.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = "0.18"

# Embeds assets/icon/velox.ico into velox.exe as its resource icon (what
# Explorer / the taskbar / the Start menu show). Windows-only: other targets
# have no such resource section and build.rs is a no-op there. See
# docs/decisions.md D52.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Windows-only subresource content blocking (Issue #22, docs/decisions.md
# D59). `wry::WebViewExtWindows::webview()` (stable, safe, public API) hands
# back the raw `ICoreWebView2` COM object wry's webview2 backend already
# holds internally; these two crates are what let us actually call methods
# on it (`AddWebResourceRequestedFilter` / `add_WebResourceRequested`) —
# `windows` for the COM interface types themselves, `webview2-com` for the
# `WebResourceRequestedEventHandler` helper that implements the COM event
# handler vtable so we don't have to. Versions are pinned to exactly what
# wry 0.56.1 depends on (see its Cargo.toml) so the `ICoreWebView2` value
# `webview()` returns is the *same type* our code imports — a version
# mismatch here would not fail to compile with a helpful error, it would
# just mean two distinct `ICoreWebView2` types that cannot be used
# interchangeably.
# Issue #46 (名前を付けて保存, docs/decisions.md D76) adds two more Windows
# Shell/COM features on top of the D59 set above:
# - `Win32_UI_Shell` / `Win32_UI_Shell_Common`: the native "Save As" file
#   picker (`IFileSaveDialog`/`IShellItem`, the `FileSaveDialog` CLSID,
#   `COMDLG_FILTERSPEC`/`SIGDN_FILESYSPATH`/`FOS_*`), used by
#   `ui::save_dialog_windows` to satisfy the issue's "保存先を選択できる"
#   acceptance criterion. This is the same classic Shell Common Item Dialog
#   API every native Windows app uses for Open/Save dialogs — not a
#   WebView2-specific type — so it needs no generation gate the way
#   `ICoreWebView2_NN` does.
# Issue #136 (docs/decisions.md D88) adds three more feature flags, all
# plain Win32 APIs (no COM/WinRT generation involved) used by
# `browser::metrics`'s Windows `sample_process_tree_rss` implementation:
# - `Win32_Foundation`: `HANDLE`/`FILETIME`/`CloseHandle`.
# - `Win32_System_Diagnostics_ToolHelp`: `CreateToolhelp32Snapshot` +
#   `Process32First/NextW` walk the process tree (PID/PPID), the Windows
#   equivalent of iterating `/proc` on Linux.
# - `Win32_System_ProcessStatus` / (`Win32_System_Threading` below):
#   `GetProcessMemoryInfo` (RSS via `WorkingSetSize`) and `GetProcessTimes`
#   (CPU time) per process, both needing an `OpenProcess` handle.
# No new crate: this project already depends on `windows` for D59/D76
# above, so Issue #136 only turns on more of its existing feature flags
# rather than adding `windows-sys` or another crate (CLAUDE.md "依存クレート
# は必要最小限に保つ").
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
strip = true

# Same codegen as [profile.release] (so hot-path behavior under the profiler
# matches what ships) but with debug info kept instead of stripped, so `perf`/
# `heaptrack`/`valgrind` can resolve Rust symbols and source lines. A separate
# profile — not a `strip = false` edit to [profile.release] itself — because
# it builds into its own `target/profiling/` directory and leaves `cargo build
# --release`'s output (and its binary size / startup cost, `strip = true`'s
# whole point) untouched. Use `cargo build --profile profiling`. See
# docs/profiling.md and docs/decisions.md D45.
[profile.profiling]
inherits = "release"
debug = true
strip = false
