# GitHub の自動生成リリースノートの分類 (Issue #94)。
#
# release-windows.yml / release-linux.yml は `generate_release_notes: true` で
# GitHub Release を作る。そのとき GitHub がこのファイルを読み、前回リリース
# 以降にマージされた PR をラベルで分類して本文に並べる。
# 運用は docs/releasing.md を参照。
#
# 使うラベルは既存のもの (`bug` / `enhancement` / `documentation` /
# `dependencies`)。ラベルの付いていない PR は末尾の「その他」に入る。
changelog:
  categories:
    - title: 不具合修正
      labels:
        - bug
    - title: 新機能・改善
      labels:
        - enhancement
    - title: ドキュメント
      labels:
        - documentation
    - title: 依存関係の更新
      labels:
        - dependencies
    - title: その他
      labels:
        - "*"
