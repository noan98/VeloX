name: Auto Merge

# 「この workflow 以外のすべてのチェックが成功 (success) またはスキップ
# (skipped / neutral) になり、かつレビュー条件を満たした PR を自動で
# マージする」仕組みを自前で用意する。設計判断は docs/decisions.md D55。
#
# ⚠️ D55 当時の導入理由は「**プライベートリポジトリでは GitHub 標準の
# auto-merge が使えない**」だった。**この前提は 2026-09-09 に消滅した** —
# リポジトリを public に変更したため、標準 auto-merge は利用できる
# (docs/decisions.md D102)。それでも自前実装を残しているのは、標準
# auto-merge が持たない下記 4. のレビューゲート (Codex / Claude の
# レビュー必須化・自動リクエスト・猶予期間) がこの仕組みの本体だから
# である。「private だから」ではなく「レビューゲートのため」に残している。
#
# 動作の流れ:
#   1. 他の workflow (CI / perf-gate / release-windows / dependency-audit)
#      が完了するたびに起動 (workflow_run)。取りこぼし防止のため 10 分
#      ごとの定期実行と手動実行も可。
#   2. `main` 向けの open な PR を全件走査し、PR ごとに head commit の
#      check-runs と commit status を集める (この workflow 自身は除外)。
#   3. 1 つでも未完了があれば待つ (何もしない)。1 つでも失敗があれば
#      スキップする。
#   4. Issue #188 (2026-09-07 方針変更): さらにレビュー状態を見る
#      (`review_gate_decision.sh` / `check_review_gate.py`)。以下の
#      いずれかに該当すればマージしない:
#        - 未解決のレビュースレッドが残っている
#        - CHANGES_REQUESTED が残っている
#        - **Codex (`chatgpt-codex-connector[bot]`) が現在の head SHA を
#          レビュー済みでない** (マージの必須要件。`CODEX_BYPASS_LABEL`
#          で免除可能 — 下記参照)。Codex は push では再レビューしない
#          ため、未レビューを検知すると `@codex review` を自動リクエスト
#          する。Codex が利用上限に達した場合は、この PR の過去のレビュー
#          で代替できなければ `@claude` へレビューを依頼する
#          (`CLAUDE_REVIEWER_LOGINS` が設定されている場合のみ有効。既定は
#          無効)。いずれのレビューも一度も無い PR は緩和しない。
#        - head SHA の push 観測時刻が猶予期間 (既定15分、下記
#          GRACE_PERIOD_MINUTES) を過ぎていない
#      CodeRabbit は判定に含めない (Free プランの制限で実質機能せず、
#      リポジトリへのアクセスも除外済み)。詳細は docs/decisions.md D91。
#   5. 上記すべてを満たせばマージする。
#
# 対象外にしたい PR には `no-automerge` ラベルを付ける。Draft PR も対象外。
# `CODEX_BYPASS_LABEL` (既定 `automerge-without-codex`) は Codex レビュー
# 要件だけを免除する — 未解決スレッド判定と CHANGES_REQUESTED 判定は
# 免除されない (人間の明示的な差し戻しを尊重するため)。Codex 側の障害・
# クォータ切れ・応答の文言変更でも全 PR が永久停止しないための最終手段の
# 保険 (D91)。
#
# 注意: GITHUB_TOKEN でマージすると、マージ後の `main` への push では他の
# workflow (ci.yml の push トリガなど) が起動しない (GitHub の仕様)。
# それが必要なら `AUTO_MERGE_TOKEN` シークレット (repo 権限の PAT) を
# 登録すると、そちらが優先して使われる。
on:
  workflow_run:
    workflows:
      - CI
      - Performance Regression Gate
      - Release (Windows)
      # Issue #37: Dependency Audit (deny.toml) を追加。PR 向けには
      # Cargo.toml/Cargo.lock/deny.toml の変更時のみ走るので、対象外の
      # PR ではこの workflow_run が発火せず check-runs にも現れない
      # (schedule 定期実行の fallback で最大 10 分遅れる程度)。
      # docs/decisions.md D63 参照。
      - Dependency Audit
    types: [completed]
  # Issue #188 / docs/decisions.md D91: 猶予期間 (既定15分) を追加した分、
  # 定期実行だけに頼るケース (workflow_run で拾えなかった PR) の最悪遅延が
  # 増えないよう、30分間隔から10分間隔に詰めた。
  #
  # ⚠️ **実測ではこの schedule はほとんど発火していない。** GitHub は負荷に
  # 応じて schedule を間引く。頼りにできるのは下記の issue_comment /
  # pull_request_review と workflow_dispatch である。
  schedule:
    - cron: "*/10 * * * *"
  # レビューの返答でゲートを即座に再評価する (待ち時間短縮)。
  #
  # **なぜ必要か**: レビュー要件を満たすまでに auto-merge の実行が 3 回要る
  # (依頼を出す → 上限/レビューを検知して次へ進む → マージ)。ところが
  # `workflow_run` は CI 完了でしか発火しないため、**レビューボットが返答
  # しても何も起こらない。** 実測では 1 段ごとに十数分〜手動 dispatch 待ちに
  # なっていた。Codex の上限メッセージも Claude のレビュー完了もコメントとして
  # 届くので、それを拾えば数秒で次段へ進む。
  #
  # ループしないか: auto-merge 自身も依頼コメントを投稿するため再発火するが、
  # 同じ head SHA への依頼はマーカーで重複防止されるので**投稿は繰り返され
  # ない**。下の `if` で自分のマーカーを含むコメントを弾き、空振りの実行自体も
  # 減らしてある。
  #
  # ⚠️ **セキュリティ**: `contents: write` とマージ権限 (および
  # `AUTO_MERGE_TOKEN` = repo 権限の PAT) を持つ workflow を、コメントで
  # 起動できるようにするのは権限昇格の経路になりうる。
  #
  # **本リポジトリは 2026-09-09 に public へ変更された** (CI の利用上限を
  # 緩和するため)。public リポジトリでは **GitHub の任意のユーザが Issue /
  # PR にコメントできる** ため、「コメントできるのは共同作業者だけ」という
  # 前提は成立しない。そこで下のジョブ `if` で **投稿者を絞り込む**:
  #   - `author_association` が OWNER / MEMBER / COLLABORATOR、または
  #   - ログイン名がレビューボット (`chatgpt-codex-connector[bot]` /
  #     `claude[bot]`) と完全一致
  # のいずれかを満たすコメントでしか起動しない。ボットのログイン名は
  # `[` `]` を含み **GitHub のユーザ名として作成できない** ので、一般
  # ユーザがこの一致を偽装することはできない。`pull_request_review`
  # トリガも同じ条件で絞る (public リポジトリではレビューも誰でも出せる)。
  #
  # なおゲート判定そのものの安全性は、この `if` ではなくジョブ本体が担保
  # している: **このジョブはコメント本文を判定に一切使わない。** 起動後は
  # `gh pr list` から open PR を取り直し、check-runs とレビュー状態を
  # API から読んで一から判定する。したがってコメントでできるのは
  # 「判定をやり直させる」ことだけで、**判定結果を変えることはできない**
  # (レビュー本体の照合は check_review_gate.py が `__typename == "Bot"`
  # まで見て行う)。`if` の絞り込みは、外部ユーザに書き込み権限付き
  # workflow を起動させないため + 空振り実行を減らすための多層防御。
  # docs/decisions.md D102 を参照。
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch: {}
  # Issue #188 / D91: この workflow 自身、またはレビュー判定ロジック
  # (check_review_gate.py / review_gate_decision.sh) を変更する PR に限り
  # dry-run 検証ジョブを走らせる。`perf-windows.yml` が採った手法
  # (D88) と同じパターン: workflow_dispatch は main にマージされるまで
  # Actions タブに現れないため、workflow 自身の変更を検証する唯一の手段。
  # 実際にマージはしない (下の dry-run-review-gate ジョブを参照)。
  #
  # paths は `.github/scripts/**` 全体にしてある。判定ロジック本体だけでなく
  # そのテスト (test_*.py) の変更でも dry-run ジョブを走らせたいため
  # — このジョブが `.github/scripts` の Python テストを回す唯一の場所である
  # (ci.yml は Rust だけを見ており、これらのテストは長らく CI で
  # 一度も実行されていなかった。docs/decisions.md D102)。
  pull_request:
    paths:
      - ".github/workflows/auto-merge.yml"
      - ".github/scripts/**"

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  # Issue #168: マージ後の Issue クローズに必要。この `permissions` ブロック
  # は明示的に列挙する形なので、ここに書かれていないスコープは GITHUB_TOKEN
  # に一切与えられない。`issues` が抜けていたため `gh issue view` が 404 を
  # 返し、「Issue が見つかりません」という警告になっていた (実際には存在して
  # いて、権限が無かっただけ)。
  issues: write

# 同時に 2 つ走って同じ PR を二重にマージしようとしないよう直列化する。
# dry-run-review-gate ジョブは読み取り専用でマージしないため、この
# concurrency グループには参加させない (別ジョブなので自動的に対象外)。
concurrency:
  group: auto-merge
  cancel-in-progress: false

env:
  # マージ方式: merge (マージコミット) / squash / rebase
  MERGE_METHOD: merge
  # このラベルが付いた PR は自動マージしない
  SKIP_LABEL: no-automerge
  # 自動マージ対象のベースブランチ
  BASE_BRANCH: main
  # Issue #188: head SHA の push 観測時刻からこの分数が経過するまで
  # マージしない (レビューボットがまだ投稿していない場合の保険。git
  # commit の committer date ではない — docs/decisions.md D91 参照)。
  GRACE_PERIOD_MINUTES: 15
  # Issue #188: このラベルが付いた PR は Codex レビュー必須要件のみを免除
  # する (未解決スレッド判定・CHANGES_REQUESTED 判定は免除しない)。
  CODEX_BYPASS_LABEL: automerge-without-codex
  # Issue #188 (2026-09-07 ユーザ決定) / Issue #194: Codex の利用上限到達時、
  # この PR が一度も Codex にレビューされていない場合のフォールバックとして
  # `@claude` へレビューを依頼する。ここに設定したログイン名 (カンマ区切り)
  # からのレビューだけを「Claude のレビュー」として認める。**空文字列なら
  # Claude フォールバックは常に不成立** (Codex の利用上限緩和のみで判断
  # する安全側)。
  #
  # `claude[bot]` は **PR #198 で実測したログイン名** (id 209825114、
  # https://github.com/apps/claude) であり、推測値ではない — Codex の P2
  # 指摘 (前方一致で別名アカウントがすり抜ける) と同じ穴を作らないよう、
  # 判定は完全一致で行う (docs/decisions.md D91 参照)。応答側の仕組みは
  # `.github/workflows/claude.yml` (Issue #194)。
  CLAUDE_REVIEWER_LOGINS: "claude[bot]"

jobs:
  auto-merge:
    name: Auto merge PRs whose checks all passed
    runs-on: ubuntu-latest
    # pull_request トリガは dry-run-review-gate 専用 (下記)。実際にマージを
    # 行うこのジョブは pull_request では絶対に起動しない。
    #
    # コメント / レビュー起動の条件 (docs/decisions.md D102)。上から順に:
    #
    #   - `issue_comment` は **PR に付いたコメントに限る**。素の Issue への
    #     コメントで走らせても、このジョブは PR しか見ないので必ず空振りする。
    #     `github.event.issue.pull_request` は PR のときだけ存在するオブジェクト
    #     なので、`.url != ''` で判別する (Issue のときは null → '' 扱い)。
    #   - auto-merge 自身が投稿した依頼コメント (マーカー入り) では起動しない。
    #     判定材料が何も増えていないので走らせても空振りするだけ。
    #   - **投稿者が信頼できる場合に限る (public リポジトリ対策)。**
    #     `author_association` が OWNER / MEMBER / COLLABORATOR か、ログイン名が
    #     レビューボットと完全一致する場合のみ。ボットのログイン名に含まれる
    #     `[` `]` は GitHub のユーザ名に使えないため、一般ユーザは偽装できない。
    #     ボットの `author_association` は NONE / CONTRIBUTOR になりうるので、
    #     ログイン名の一致を別に見る必要がある。
    #   - `pull_request_review` も同条件で絞る。public リポジトリでは
    #     **レビューも誰でも提出できる**ため、コメントと同じ扱いにする。
    #
    # **レビューボットの返答では起動する** — それがこのトリガを足した目的である。
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'issue_comment'
      || (github.event.issue.pull_request.url != ''
      && !contains(github.event.comment.body, '<!-- auto-merge:')
      && (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      || contains(fromJSON('["chatgpt-codex-connector[bot]", "claude[bot]"]'), github.event.comment.user.login))))
      && (github.event_name != 'pull_request_review'
      || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
      || contains(fromJSON('["chatgpt-codex-connector[bot]", "claude[bot]"]'), github.event.review.user.login))
    steps:
      # Issue #168: この job は元々リポジトリを checkout していなかった
      # (gh CLI と API しか使わないため必要が無かった)。マージ後の Issue
      # クローズが `.github/scripts/extract_closing_issues.py` を実行する
      # ようになったので、checkout が必須になった。これが無いとスクリプト
      # が見つからず、抽出結果が空になって「1 件も閉じないまま成功する」
      # という、まさにこの Issue が直そうとしている症状に戻ってしまう。
      - uses: actions/checkout@v7

      - name: Merge eligible pull requests
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # この workflow 自身が check-run に現れた場合に除外するための名前
          SELF_WORKFLOW: ${{ github.workflow }}
          SELF_JOB: Auto merge PRs whose checks all passed
          # Issue #188 / #201 / D91: `@claude` メンション / `@codex review`
          # の投稿専用。PR #193 (`@claude`) / PR #200 (`@codex review`) で
          # それぞれ実測したところ、GITHUB_TOKEN (= github-actions[bot] と
          # して投稿) したコメントには Claude App / Codex のどちらも
          # 反応しなかった (Web UI から人間が投稿したメンションには反応
          # した)。そのためどちらの投稿も GH_TOKEN (上記の
          # AUTO_MERGE_TOKEN||GITHUB_TOKEN フォールバック) を使わず、この
          # 専用の PAT が設定されている場合のみ行う
          # (review_gate_decision.sh 側で判定)。未設定なら secret 参照は
          # 空文字列になる (GitHub Actions の仕様)。
          AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail

          # PR 一覧 (open かつ BASE_BRANCH 向け)
          prs=$(gh pr list --state open --base "$BASE_BRANCH" --limit 100 \
                  --json number,title,isDraft,labels,headRefOid,headRefName)
          count=$(echo "$prs" | jq 'length')
          echo "対象候補: ${count} 件の open PR (base: ${BASE_BRANCH})"
          if [ "$count" -eq 0 ]; then
            exit 0
          fi

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            number=$(echo "$pr" | jq -r '.number')
            title=$(echo "$pr" | jq -r '.title')
            sha=$(echo "$pr" | jq -r '.headRefOid')
            draft=$(echo "$pr" | jq -r '.isDraft')
            has_skip=$(echo "$pr" | jq -r --arg l "$SKIP_LABEL" \
                         '[.labels[].name] | index($l) != null')
            has_codex_bypass=$(echo "$pr" | jq -r --arg l "$CODEX_BYPASS_LABEL" \
                         '[.labels[].name] | index($l) != null')

            echo "::group::PR #${number} ${title} (${sha:0:7})"

            if [ "$draft" = "true" ]; then
              echo "skip: Draft PR"
              echo "::endgroup::"; continue
            fi
            if [ "$has_skip" = "true" ]; then
              echo "skip: ラベル '${SKIP_LABEL}' が付いている"
              echo "::endgroup::"; continue
            fi

            # --- check-runs (GitHub Actions / GitHub App のチェック) ---
            # filter=latest (既定) なので、再実行した場合は最新の結果だけ見る。
            # この workflow 自身 (workflow 名 / job 名) は判定から除外する。
            runs=$(gh api --paginate \
                     "repos/${GH_REPO}/commits/${sha}/check-runs?per_page=100" \
                     --jq '.check_runs[]' | jq -s \
                     --arg self "$SELF_WORKFLOW" --arg self_job "$SELF_JOB" \
                     '[.[] | select(.name != $self and .name != $self_job)]')

            # --- commit status (レガシー API を使う外部サービス向け) ---
            statuses=$(gh api "repos/${GH_REPO}/commits/${sha}/status" \
                         --jq '.statuses')

            total=$(jq -n --argjson r "$runs" --argjson s "$statuses" \
                      '($r | length) + ($s | length)')
            if [ "$total" -eq 0 ]; then
              echo "wait: まだチェックが 1 つも登録されていない"
              echo "::endgroup::"; continue
            fi

            echo "check-runs:"
            echo "$runs" | jq -r '.[] | "  - \(.name): \(.status) / \(.conclusion // "-")"'
            if [ "$(echo "$statuses" | jq 'length')" -gt 0 ]; then
              echo "statuses:"
              echo "$statuses" | jq -r '.[] | "  - \(.context): \(.state)"'
            fi

            pending=$(jq -n --argjson r "$runs" --argjson s "$statuses" \
              '([$r[] | select(.status != "completed")] | length)
               + ([$s[] | select(.state == "pending")] | length)')
            if [ "$pending" -gt 0 ]; then
              echo "wait: 未完了のチェックが ${pending} 件ある"
              echo "::endgroup::"; continue
            fi

            failed=$(jq -n --argjson r "$runs" --argjson s "$statuses" \
              '([$r[] | select(.conclusion != "success"
                                and .conclusion != "skipped"
                                and .conclusion != "neutral")] | length)
               + ([$s[] | select(.state != "success")] | length)')
            if [ "$failed" -gt 0 ]; then
              echo "skip: 成功/スキップ以外のチェックが ${failed} 件ある"
              echo "::endgroup::"; continue
            fi

            echo "check-runs / commit status: all green"

            # --- Issue #188: レビュー状態の判定 -------------------------
            # check-runs / commit status には現れない Pull Request の
            # レビュー (Codex の指摘、人間のレビュー) を見る。Codex が
            # 現在の head SHA をレビュー済みであることも必須要件
            # (CODEX_BYPASS_LABEL で免除可能)。判定ロジック本体は
            # review_gate_decision.sh / check_review_gate.py に切り出して
            # あり単体テストがある (docs/decisions.md D91)。GraphQL 呼び出し
            # 自体の失敗も含めて常に「安全側 = マージしない」に倒す
            # (取得できなかったので指摘ゼロとみなす、は絶対にしない)。
            echo "レビュー状態を確認します (Issue #188):"
            if [ "$has_codex_bypass" = "true" ]; then
              echo "  '${CODEX_BYPASS_LABEL}' ラベルあり: Codex レビュー要件のみ免除 (未解決スレッド/CHANGES_REQUESTED は免除されません)"
            fi
            # 第4引数 "true": Codex がこの head SHA をまだレビューして
            # いなければ実際に `@codex review` を自動投稿する (pull-requests:
            # write が要る。この job のみが実際に投稿する — dry-run job は
            # 読み取り専用のまま「投稿する判定になった」ことをログに出す
            # だけ)。
            review_gate_output=""
            review_gate_rc=0
            review_gate_output=$(bash .github/scripts/review_gate_decision.sh "$number" "$sha" "$has_codex_bypass" "true") \
              || review_gate_rc=$?
            if [ -n "$review_gate_output" ]; then
              echo "$review_gate_output" | sed 's/^/  /'
            fi
            if [ "$review_gate_rc" -ne 0 ]; then
              echo "wait: レビュー状態が条件を満たさないためマージを見送ります"
              echo "::endgroup::"; continue
            fi
            echo "  問題なし (未解決スレッド 0 件 / CHANGES_REQUESTED 0 件 / Codex レビュー条件を満たす / 猶予期間経過済み)"

            echo "all green: マージします (${MERGE_METHOD})"
            # --match-head-commit: 判定した commit から PR が進んでいたら
            # マージしない (新しい commit のチェックが未評価のため)。
            if gh pr merge "$number" "--${MERGE_METHOD}" \
                 --match-head-commit "$sha" --delete-branch; then
              echo "merged: PR #${number}"

              # --- Issue #168 -------------------------------------------
              # GITHUB_TOKEN でのマージは GitHub 側のそれ以上の自動処理
              # (Closes キーワードによる Issue 自動クローズ) を誘発しない
              # ため、ここで明示的に閉じる。AUTO_MERGE_TOKEN (PAT) が
              # 登録されて本物の自動クローズが効くようになった場合でも、
              # 対象 Issue は既に closed のはずなので下の冪等チェックで
              # 何もせず skip になる (二重クローズしない)。
              # 抽出ロジック本体は .github/scripts/extract_closing_issues.py
              # に切り出してあり、単体テストがある
              # (.github/scripts/test_extract_closing_issues.py)。
              # 抽出の失敗 (スクリプトが無い・python が落ちる等) を握り
              # つぶさないこと: 黙って空を返すと「1 件も閉じないまま成功」
              # に見え、この Issue が直そうとしている症状と区別が付かない。
              # 1 件の PR の失敗で他の PR のマージまで止める必要は無いので、
              # 警告を出して次へ進む。
              body=$(gh pr view "$number" --json body --jq '.body // ""')
              if ! issues=$(printf '%s' "$body" | \
                   python3 .github/scripts/extract_closing_issues.py); then
                echo "::warning::PR #${number} 本文からの Closes 抽出に失敗しました (Issue は閉じられていません)"
                issues=""
              fi
              if [ -n "$issues" ]; then
                echo "$issues" | while read -r issue; do
                  [ -z "$issue" ] && continue
                  # gh の stderr は捨てないこと: 「存在しない」と「権限が
                  # 無い」はどちらもここで失敗するが、原因はまったく違う。
                  # 実際に #168 の初回リリースでは `issues` 権限が無くて
                  # 404 になっていたのに、メッセージが「見つかりません」
                  # だったため原因がログから読み取れなかった。
                  if ! state=$(gh issue view "$issue" --json state --jq '.state' 2>&1); then
                    echo "::warning::Issue #${issue} の状態を取得できませんでした (PR #${number} 本文の Closes 参照): ${state}"
                    continue
                  fi
                  if [ "$state" = "CLOSED" ]; then
                    echo "skip: Issue #${issue} は既に closed (PR #${number})"
                    continue
                  fi
                  if gh issue close "$issue" --reason completed; then
                    echo "closed: Issue #${issue} (PR #${number} の Closes キーワードにより)"
                  else
                    echo "::warning::Issue #${issue} のクローズに失敗しました (PR #${number})"
                  fi
                done
              fi
            else
              # ブランチ保護 (レビュー必須など) や競合でマージできない場合。
              # 他の PR の処理は続ける。
              echo "::warning::PR #${number} のマージに失敗しました (競合・ブランチ保護など)"
            fi
            echo "::endgroup::"
          done

  # Issue #188 / docs/decisions.md D91: この workflow 自身、またはレビュー
  # 判定ロジックを変更する PR に限り、上の on.pull_request.paths フィルタで
  # 起動する dry-run 検証ジョブ。実際の auto-merge ジョブとは別ジョブに分け、
  # permissions を読み取り専用に絞ってある。理由: pull_request トリガは
  # (pull_request_target と異なり) PR ブランチ側の workflow 定義で実行される
  # — D55 が本 workflow で pull_request トリガそのものを避けた理由と同じ
  # リスクが、この検証ジョブにも本質的には残る。auto-merge ジョブが持つ
  # `contents: write` / `pull-requests: write` / `issues: write` を万一にも
  # 渡さないよう、job 単位の permissions で明示的に読み取り専用へ絞り込み、
  # `gh pr merge` や `gh issue close` の類は一切呼ばない (呼び出しているのは
  # review_gate_decision.sh の読み取り専用 API だけ)。これにより、たとえ
  # このジョブの中身が PR 側で改変されても、書き込み系の操作はできない。
  dry-run-review-gate:
    name: (dry-run) レビュー判定ロジックの検証
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # review_gate_decision.sh が head SHA の push 観測時刻を取得するため
      # に check-suites API (commits/{sha}/check-suites) を呼ぶ (D91)。
      checks: read
    steps:
      - uses: actions/checkout@v7

      # Issue #188 / D102: 判定ロジックの単体テスト。これまで
      # `.github/scripts/test_*.py` は CI のどこからも実行されていなかった
      # (ci.yml は Rust のみ)。ロジックを触る PR ではここで必ず回す。
      - name: 判定ロジックの単体テスト
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: レビュー判定ロジックの shell 側テスト
        run: bash .github/scripts/test_review_gate_decision.sh

      - name: レビュー判定ロジックを検証実行する (マージは一切行わない)
        env:
          # 意図的に secrets.AUTO_MERGE_TOKEN は使わない — このジョブは
          # 読み取りのみを行う検証用であり、書き込み権限を持つ PAT を
          # 渡す理由が無い。GITHUB_TOKEN も上の permissions により
          # 読み取りスコープに制限されている。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="${{ github.event.pull_request.number }}"
          sha="${{ github.event.pull_request.head.sha }}"
          codex_bypass=$(echo '${{ toJSON(github.event.pull_request.labels) }}' \
            | jq -r --arg l "$CODEX_BYPASS_LABEL" '[.[].name] | index($l) != null')
          echo "::group::PR #${number} (${sha:0:7}) のレビュー判定を検証 (dry-run: マージは行いません)"
          if [ "$codex_bypass" = "true" ]; then
            echo "  '${CODEX_BYPASS_LABEL}' ラベルあり: Codex レビュー要件のみ免除"
          fi
          rc=0
          # 第4引数 "false": このジョブは読み取り専用 (permissions に
          # pull-requests: write が無い) なので、Codex 未レビューを検知
          # しても実際には `@codex review` を投稿しない (投稿する判定に
          # なったことだけがログに出る)。
          bash .github/scripts/review_gate_decision.sh "$number" "$sha" "$codex_bypass" "false" | sed 's/^/  /' || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "判定結果: マージ可 (レビュー起因のブロック要因なし)"
          elif [ "$rc" -eq 1 ]; then
            echo "判定結果: マージ見送り (上記の理由による)"
          else
            echo "判定結果: 判定失敗 (rc=${rc}、API 呼び出し自体のエラー。上記の ::warning:: を参照)"
            exit 1
          fi
          echo "::endgroup::"
