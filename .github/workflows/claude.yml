name: Claude Code

# `@claude` メンションに応答して、レビューやコード変更を行わせるための
# workflow (Issue #194、docs/decisions.md D91 の Revisit condition (7))。
#
# なぜ必要か:
#   auto-merge.yml (D91) は Codex が利用上限に達したとき、フォールバックとして
#   PR に `@claude` メンションでレビューを依頼する。しかしこの workflow が
#   無いと**メンションを投げても誰も応答しない**ため、依頼が空打ちになる。
#
# ⚠️ auto-merge.yml との連携で押さえておくべき制約:
#   - claude-code-action は **bot が投稿したコメントでは既定で起動しない**
#     (`allowed_bots` に明記しない限り。無限ループ防止のための仕様)。
#   - 加えて GitHub の仕様上、`GITHUB_TOKEN` で投稿したコメントは
#     そもそも workflow のトリガにならない。
#   → したがって auto-merge.yml 側は `@claude` の投稿にだけ
#     `AUTO_MERGE_TOKEN` (PAT) を明示的に使う実装になっている。
#     **`AUTO_MERGE_TOKEN` が未設定だと auto-merge は `@claude` を投稿せず、
#     警告を出して止まる** (空打ちで「依頼が届いた」と誤認させないため)。
#   - `github-actions[bot]` を `allowed_bots` に足せば GITHUB_TOKEN 経由でも
#     起動できるように見えるが、上記のとおり GITHUB_TOKEN のコメントは
#     workflow トリガ自体が発火しないため解決にならない。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # メンションを含むコメントだけを対象にする。これが無いと全コメントで
    # ジョブが起動してしまう。
    if: contains(github.event.comment.body, '@claude')
    name: Respond to @claude mention
    runs-on: ubuntu-latest
    permissions:
      # Claude がファイルを変更できるようにする (レビューだけでなく
      # 「直しておいて」にも応えられるようにするため)。
      contents: write
      pull-requests: write
      issues: write
      # GitHub App 認証に必要。
      id-token: write
      # CI の結果を読ませる (失敗原因の調査を頼めるようにするため)。
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Claude はローカルのコードを読むだけなので浅いクローンで足りる。
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # 認証は OAuth トークン。API キー (`anthropic_api_key`) を使う
          # 場合は入力名が変わるので注意。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
