name: Claude Code

# `@claude` メンションに応答して、レビューやコード変更を行わせるための
# workflow (Issue #194、docs/decisions.md D91 の Revisit condition (7))。
#
# Public repository では issue_comment / pull_request_review_comment を誰でも発火できるため、
# リポジトリへの write 権限を持つ Claude workflow を外部ユーザーから直接起動できないようにする。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Public repository の外部ユーザーからの @claude 実行を禁止する。
    # author_association はコメント投稿者とリポジトリとの関係を表す。
    # OWNER / MEMBER / COLLABORATOR のみ、contents:write 等を持つ Claude を起動できる。
    if: >-
      github.event.comment.user.type != 'Bot' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      contains(github.event.comment.body, '@claude')
    name: Respond to @claude mention
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@b7912aeeb535234e3e9385ff49e8237f689b5f14
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Issue #194 の診断用。既定 (false) では実行本体のログが
          # "Running Claude Code via SDK (full output hidden for security)"
          # に置き換えられ、**失敗の原因が読めない**。run 34231609201 では
          # `is_error: true` / `modelUsage: {}` (モデル呼び出し 0 回) まで
          # 分かったが、肝心のエラー本文がここで伏せられていた。
          #
          # **2026-09-09 に false (action の既定) へ戻した。理由は 2 つ。**
          #
          #   1. **診断が完了した。** 原因は `CLAUDE_CODE_OAUTH_TOKEN` の値に
          #      改行が混入していたことで、再登録後は tag モードで PR #216 を
          #      レビューできることまで実測済み (docs/decisions.md D98)。
          #      この行を足した目的はもう果たされている。
          #   2. **「本リポジトリはプライベートなので、ログを読めるのは
          #      オーナーだけ」という当初の但し書きは誤りになった。**
          #      リポジトリは 2026-09-09 に public へ変更されており、
          #      **Actions のログは誰でも読める** (docs/decisions.md D102)。
          #      action がこの出力を既定で伏せているのは
          #      ("full output hidden for security")、実行ログに環境の情報が
          #      そのまま出うるためで、public では既定に従うのが安全側。
          #
          # 再び診断が必要になったら、まず `claude-token-check.yml` の
          # プローブ (workflow_dispatch、オーナーのみ起動可) を使うこと。
          # それでも足りなければこの行を一時的に true へ戻す。
          show_full_output: false
