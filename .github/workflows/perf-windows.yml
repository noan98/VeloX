name: Performance (Windows)

# Issue #136。VeloX の性能実測はこれまで全て Linux (WebKitGTK/Xvfb、
# perf-gate.yml/docs/performance-targets.md) のものしかなく、CLAUDE.md
# 「対応 OS の優先度」が最優先と定める Windows (WebView2) の数値が
# 1 つも無かった。この workflow はそれを埋めるための **手動実行 + 週次
# スケジュール実行** ジョブ (後者は Issue #211 項目4 で追加。導入時点では
# 手動実行専用だった — 経緯は下記参照)。
#
# Issue #208 (docs/performance-targets.md §26) で役割が 1 つ増えた:
# 入力 `compare_env` に `KEY=VALUE` を渡すと、**同一ジョブ・同一ビルド・
# 同一ランナーの中で「既定 (A)」と「その環境変数を設定した状態 (B)」を
# 交互に計測する**。run をまたぐ比較では分離できないランナー個体差や
# ランナーイメージの更新を相殺できるので、性能回帰の原因切り分けに使う。
# 空欄にすれば従来どおりの単独計測に戻る。
#
# **手動実行 (workflow_dispatch) と週次スケジュール実行 (schedule) のみ。
# PR ごとの自動実行や性能回帰ゲートではない** (Issue #136 のスコープ外。
# 回帰ゲートは Linux の perf-gate.yml が引き続き担う。ゲート化しない理由は
# 下記「Issue #211 項目4」の節を参照):
#   - 性能回帰ゲートは Linux 側 (perf-gate.yml) で担保済みであり、
#     二重化する必要が無い。
#   - GUI アプリを CI 上で起動する構成は不安定になりやすく、PR を無用に
#     ブロックしたくない。
#   - Windows ランナーは Linux ランナーより実行コストが高い。
#
# ⚠️ **最大のリスク: windows-latest ランナー上で VeloX (WebView2 の
# ウィンドウ) が起動できるかどうかは、この workflow を実際に走らせるまで
# 分からない。** Linux は Xvfb で仮想ディスプレイを用意しているが、
# Windows ランナーには同種の仕組みが無い。ci.yml の Windows ジョブが
# D61 の判断で統合テスト (実ウィンドウを開くテスト) を意図的に除外して
# いるのも同じ未検証点による — この workflow の「VeloX を起動する」
# ステップが、そのものずばりの実地検証になる。起動できなかった場合は
# 無理に通そうとせず、Job Summary / 診断ステップのログに何が起きたかを
# 残し、セルフホストランナー等の方式再検討を次の課題とする
# (docs/decisions.md D88、Issue #59 が起動時間の調査で採った進め方と同じ)。
#
# ## Issue #211 項目4: なぜ `schedule` を足すか / なぜまだゲート化しないか
#
# D96 (Issue #208) が明らかにしたのは「`windows-latest` は run ごとに機種
# の異なるマシンを割り当てる」ことだった (AMD EPYC 9V74 / Intel Xeon
# 8573C / Intel Xeon 6973P-C / AMD EPYC 7763 の 4 機種が観測済み、
# `startup_window_created_ms` は 573〜922ms まで散らばる)。**手動実行
# だけでは、いつ・どの機種のデータが何本貯まるかを制御できず、機種ごとの
# 傾向を見るには本数が全く足りない。** そこで `schedule` を足し、既定条件
# (cold_startup、A/B 比較) で機械的に run を積み重ねる。機種ごとに系列を
# 分けて蓄積できるのは、Issue #211 項目2 (`docs/decisions.md` D106、
# `scripts/dashboard/common.py` の `machine_key`) が「同一 session_id でも
# 機種が違えば比較しない」を保証しているおかげである。
#
# **取り込みの導線はこのファイル末尾の `ingest-history` ジョブにある**
# (D132)。D106 の時点では artifact に残すだけで、`results/history/` への
# commit 導線は「誰が commit を作るか」の運用設計が要るとして未着手のまま
# だった — その設計が D132 である。
#
# **ここではまだ fail させない (ゲート化しない)。** 理由:
#   - Issue #211 項目3 (同一機種内での分散の実測) が未着手で、「どこからが
#     有意な差か」の閾値をまだ決められない。実測もせず勘で閾値を決めると、
#     D46/D96 が繰り返し指摘してきた「ノイズを回帰の証拠であるかのように
#     見せる」誤りを、今度は Windows の機種間・機種内ノイズに対してやる
#     ことになる。
#   - 機種ごとの系列 (machine_key) がある程度の本数貯まって初めて、
#     「同一機種内で許容できるばらつき」を実測できる。それより前に閾値を
#     決めるのは、D46 が実測データより先に何かを決め打ちすることを繰り返し
#     戒めてきたのと同じ誤りになる。
#   - したがってこの PR (Issue #211) では「貯める」ことだけを目的にし、
#     ゲート化は項目3 の実測が揃ってから改めて判断する。
#
# **頻度は週次にした。** 理由:
#   - Windows ランナーは (上記の通り) Linux ランナーより実行コストが高い。
#     日次では月に約 30 回の高コスト run を積み増すことになり、まだ
#     ゲート化もしない蓄積目的のデータにその頻度は見合わない。
#   - 一方で月次では、機種のサンプルが十分な本数に育つまで数ヶ月〜半年を
#     要し、項目3 (分散の実測) の着手が不必要に遅れる。
#   - `windows-latest` の機種はランナー割り当てのたびに変わりうる (D96)
#     ため、頻度を上げて「同一機種の run 数」を意図的に稼ぐことはできない
#     — 週次でも機種は毎回変わりうる。**この不確実性はコストを上げても
#     解消しないので、コストの低い側 (週次) を選ぶ。**
#   - cron は UTC で評価される。UTC 月曜 03:00 (JST 月曜正午ごろ) とし、
#     平日日中の CI 混雑時間帯を避けた。
#
# `on:` は workflow_dispatch が基本だが、release-windows.yml と同じ
# パターンで、この workflow 自身を変更する PR に限り pull_request でも
# 走らせる — workflow_dispatch は main にマージされるまで Actions タブに
# 現れないため、workflow 自身の変更を検証する唯一の手段になる。`schedule`
# は既定ブランチ (main) の workflow 定義でのみ評価され、fork や他ブランチ
# の同名ファイルからは起動しない (GitHub の仕様) — CLAUDE.md「public
# リポジトリであることは workflow を書くときの前提条件」の対象は
# `issue_comment`/`pull_request_review` のような「任意の GitHub ユーザが
# 発火できる」トリガであり、`schedule` はそれに該当しない (発火元はリポジ
# トリ設定であり、外部ユーザは発火できない)。書き込み権限やシークレットを
# 使うステップも無いため、投稿者を絞る `if` の追加は不要と判断した。
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "velox-bench list-scenarios の一覧から選ぶシナリオ ID"
        type: choice
        default: cold_startup
        options:
          - cold_startup
          - warm_startup
          - first_page_load
          - navigation
          - tab_create
          - tab_switch
          - tab_resume
          - background_cpu
          - tab_create_1
          - tab_create_5
          - tab_create_10
          - tab_create_20
          - tab_create_50
          - tab_switch_1
          - tab_switch_5
          - tab_switch_10
          - tab_switch_20
          - tab_switch_50
          - tabs_1
          - tabs_5
          - tabs_10
          - tabs_20
          - tabs_50
          # Issue #197 / §27.5。tabs_N と違い、タブを間隔を空けて開き、
          # 既定のメモリチェック周期でも休止が起き切るまで待ってから
          # mark を打つ (集計は mark 以降のみ)。**環境変数で周期を
          # 縮めなくても、既定設定のままのメモリ予算の効きが測れる。**
          - tabs_hold_1
          - tabs_hold_5
          - tabs_hold_10
          - tabs_hold_20
          - tabs_hold_50
          - tabs_hold_resume_1
          - tabs_hold_resume_5
          - tabs_hold_resume_10
          - tabs_hold_resume_20
          - tabs_hold_resume_50
          # Issue #279 / D110 Revisit condition (3)。tabs_hold_resume_N と
          # 最後のラウンドの wait まで完全に同一で、そのあとに 22 秒待つ
          # ("揺り戻し" — 戻したタブが次のメモリ判定で再び休止されるか)。
          - tabs_hold_bounce_1
          - tabs_hold_bounce_5
          - tabs_hold_bounce_10
          - tabs_hold_bounce_20
          - tabs_hold_bounce_50
      scenarios:
        description: "複数シナリオを 1 回の run で続けて計測する (カンマ区切り、例: tabs_1,tabs_5,tabs_10,tabs_20)。指定するとシナリオ選択より優先される。D96 の「Windows は run ごとに分ける」に従い、タブ数スケーリングのような複数点の比較はこれで同一 run に収める"
        type: string
        default: ""
      trials:
        description: "試行回数 (velox-bench run --trials)"
        type: string
        default: "10"
      compare_env:
        description: "A/B 比較の B 条件で追加する環境変数 (KEY=VALUE、複数はセミコロン区切り)。空欄なら比較せず A 条件だけを 1 回計測する"
        type: string
        default: "VELOX_MEMORY_BUDGET_MB=0"
      common_env:
        description: "A/B の両方に共通で設定する環境変数 (KEY=VALUE、セミコロン区切り)。測定条件を成立させるための設定に使う (例: tabs_N でメモリ予算を評価するときの VELOX_MEMORY_CHECK_INTERVAL_MS=500)"
        type: string
        default: ""
      repeats:
        description: "A/B のペアを何回繰り返すか (compare_env が空のときは無視される)"
        type: string
        default: "2"
      page:
        description: "loopback で配信する scripts/bench/pages/ の固定ページ。ページの重さで page_load_ms は桁が変わるので、記録済みの値 (§21〜§31 はすべて minimal.html) と比べるときは必ず揃えること。url を指定した場合は無視される"
        type: choice
        default: minimal.html
        options:
          - minimal.html
          - dom_heavy.html
          - text.html
      pages:
        description: "複数ページを 1 回の run で続けて計測する (カンマ区切り、例: minimal.html,dom_heavy.html)。指定するとページ選択より優先される。D96 の「run をまたいだ絶対値は比較できない」に従い、ページ差を見る計測はこれで同一 run に収める (Issue #231)"
        type: string
        default: ""
      beacon:
        description: "busy.html の beacon を数える (Issue #247)。背景タブで rAF / setInterval が進んでいるかを、ページ自身が投げる HTTP リクエストとしてブラウザの外側から数える。タイトルを読む方法だと計測対象のタブで JS を評価することになり、測ろうとしているものを乱しうるため。page / pages に busy.html を含めたときだけ意味がある"
        type: boolean
        default: false
      url:
        description: "計測対象ページの URL。空欄なら scripts/bench/pages/ の固定ページ (上の page / pages) を loopback 配信して使う。指定すると page / pages は無視される"
        type: string
        default: ""
  # この workflow 自身を変更する PR でのみ実行して検証する (docs/
  # decisions.md D88、release-windows.yml と同じパターン)。それ以外の PR
  # では走らない。workflow_dispatch の入力は使えないため、既定値
  # (cold_startup / 10 回 / 固定ページ) で実行する。
  pull_request:
    paths:
      - ".github/workflows/perf-windows.yml"
  # Issue #211 項目4 / docs/decisions.md D106。機種ごとの系列を貯めるための
  # 定期計測 — 頻度・ゲート化を見送る理由は冒頭のコメント参照。cron は
  # UTC で評価される (UTC 月曜 03:00)。`schedule` は既定ブランチ (main) の
  # workflow 定義だけで評価され、他ブランチ/fork のこのファイルからは
  # 発火しない (GitHub の仕様)。
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always

# 手動実行はいつでも重ねて起動できてよい (前回の結果を待たずに再実行したい
# 場面がある) ので、Linux の perf-gate.yml のような直列化は行わない。
# ブランチ + workflow_dispatch の入力が同じ場合のみ、素朴に前の実行を
# 置き換える (cancel-in-progress = true) — Windows ランナーは高コストな
# ため、同一条件の実行を並べて無駄に消費しないようにする。schedule は常に
# `github.ref` = `refs/heads/main` で走るので、同じグループに乗る手動実行
# (main を対象にしたもの) と重なった場合は後勝ちで前者/後者が cancel
# されうる — 週次 1 回・手動実行は稀という運用なので実害は無いと判断した。
concurrency:
  group: perf-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-windows:
    name: velox-bench run (windows-latest)
    runs-on: windows-latest
    # workflow_dispatch では常に走る。schedule では毎週月曜 UTC 03:00 に
    # main に対して走る (Issue #211 項目4)。pull_request では上の paths
    # フィルタにより、この workflow 自身を変更する PR だけがここに来る。
    timeout-minutes: 30
    # Issue #211 項目4 の後半 / D106 Revisit condition (1)。取り込みジョブ
    # (ingest-history) へ渡す値。
    #
    # ⚠️ `artifact_name` は下の「Upload results」の `name:` と**字面が完全に
    # 一致していなければならない。** 片方だけ直すと、取り込みジョブが
    # 存在しない artifact を取りにいって失敗する — しかも失敗するのは
    # **週 1 回の schedule 実行だけ**で、PR の CI は緑のままである。
    # 重複を承知でここに置き、`test_perf_windows_inputs.py` が 2 箇所の
    # 字面を突き合わせる (同ファイルが正規表現に対してやっているのと同じ
    # 方法 — 「片方だけ直したら必ず落ちる」状態を作る)。
    outputs:
      artifact_name: velox-perf-windows-${{ (inputs.scenarios != '' || inputs.pages != '') && 'multi' || (inputs.scenario || 'cold_startup') }}
      compare_env: ${{ steps.bench_run.outputs.compare_env }}
      common_env: ${{ steps.bench_run.outputs.common_env }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # docs/performance-targets.md §1 は「測定環境を固定して記録する」
      # ことを求めている。GitHub-hosted ランナーは実行のたびにイメージが
      # 変わりうるため、毎回このステップで実際の値をログと Job Summary に
      # 残す (数値を決め打ちで文書に書かず、都度記録する)。
      - name: Record environment info (OS build / CPU / memory / WebView2 Runtime)
        id: env_info
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $mem = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)

          # WebView2 Runtime のバージョンはレジストリの pv 値から読む
          # (Evergreen ランタイムの標準的な確認方法)。見つからない場合は
          # 「不明」として記録する — このステップ自体は失敗させない
          # (実測の主目的である velox-bench run を先に進めるため)。
          $webview2Version = "(不明)"
          $regPaths = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          foreach ($p in $regPaths) {
            if (Test-Path $p) {
              $pv = (Get-ItemProperty -Path $p -Name "pv" -ErrorAction SilentlyContinue).pv
              if ($pv) { $webview2Version = $pv; break }
            }
          }

          # PowerShell の here-string (@"..."@) は閉じ側を行頭に置く必要が
          # あり、YAML のブロックスカラーが持ち込むインデントと相性が悪い
          # ため、行の配列 + join で組み立てる。
          $lines = @(
            "| 項目 | 値 |",
            "| --- | --- |",
            "| OS | $($os.Caption) |",
            "| OS ビルド番号 | $($os.BuildNumber) |",
            "| CPU | $($cpu.Name) ($($cpu.NumberOfLogicalProcessors) 論理コア) |",
            "| メモリ (物理, GiB) | $mem |",
            "| WebView2 Runtime | $webview2Version |",
            "| rustc | $(rustc --version) |"
          )
          $summary = $lines -join "`n"
          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          New-Item -ItemType Directory -Force -Path results | Out-Null
          $summary | Out-File -FilePath "results\environment-info.md" -Encoding utf8

          # Issue #208 (§26.4 事実 2)。`windows-latest` は run ごとに別
          # スペックのマシン (2 論理コア/8 GiB と 4 論理コア/16 GiB の両方が
          # 観測されている) が割り当てられるため、**どのランナーで測ったかを
          # 結果のすぐ隣に出す。** これが違う run どうしの絶対値は比較できない。
          "cpu=$($cpu.Name)" >> $env:GITHUB_OUTPUT
          "cores=$($cpu.NumberOfLogicalProcessors)" >> $env:GITHUB_OUTPUT
          "ram_gib=$mem" >> $env:GITHUB_OUTPUT
          # D148。休止スイープの時系列 (下の「Show suspend sweep timeline」)
          # が RAM 相対の予算 (D114、`memory_budget_for_ram`) を再現する
          # ための生の値。丸めた `ram_gib` からでは 1 MiB 単位で合わない。
          "ram_bytes=$([int64]$os.TotalVisibleMemorySize * 1KB)" >> $env:GITHUB_OUTPUT

      - name: Build (release)
        run: cargo build --release

      # 入力 (または pull_request 実行時の既定値) から --url を決める。
      # 未指定/空なら scripts/bench/pages/ の固定ページを loopback 配信し、
      # ネットワーク非依存の再現可能な数値にする (perf-gate.yml / D46 と
      # 同じ方針)。
      # 入力はシェルへ直接展開せず環境変数で渡す (script injection 対策)。
      # `pages` は choice ではなく自由記述なので、とくにここが要る。
      - name: Determine benchmark URL
        id: bench_url
        shell: pwsh
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_PAGE: ${{ inputs.page }}
          INPUT_PAGES: ${{ inputs.pages }}
          INPUT_BEACON: ${{ inputs.beacon }}
        run: |
          $ErrorActionPreference = "Stop"
          $url = $env:INPUT_URL
          # ⚠️ `inputs.*` は workflow_dispatch 以外のイベント (schedule /
          # pull_request) では**常に空文字列**になる (GitHub の仕様、D106
          # で実際に踏んだ罠)。既定値をここで補わないと、週次実行と自己
          # テストが「ページ未指定」で落ちる。
          $page = $env:INPUT_PAGE
          if ([string]::IsNullOrWhiteSpace($page)) { $page = "minimal.html" }

          # Issue #231。ページの重さによる違いは **同一 run 内でしか読めない**
          # (D96 決定 3: run ごとにランナーの機種が変わり、絶対値は 23% 動く)。
          # `scenarios` が複数シナリオに対して解いたのと同じ問題なので、同じ形で
          # 複数ページを 1 つのジョブに収める。
          $pagesRaw = $env:INPUT_PAGES
          if (-not [string]::IsNullOrWhiteSpace($pagesRaw)) {
            $pageList = @($pagesRaw -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($pageList.Count -eq 0) {
              throw "pages の書式が不正です: '$pagesRaw' (カンマ区切りのファイル名を指定してください)"
            }
          } else {
            $pageList = @($page)
          }

          # シナリオ専用のフィクスチャ。**汎用の計測対象ページではない**
          # ので `page` の choice には載せていない (`background_cpu` は
          # `busy.html` を `?idle=1` 付きで読む、など)。
          # `.github/scripts/test_perf_windows_inputs.py` が、この一覧と
          # choice の一覧が食い違わないことを検査する。
          $fixturePages = @("busy.html", "download.html", "network_activity.html")
          $usedFixtures = @()

          if ([string]::IsNullOrWhiteSpace($url)) {
            # **ファイル名として安全な字だけを通す。** ここは URL の組み立てと
            # 結果ファイル名の両方に使われるので、`..` やスラッシュを通すと
            # 配信ディレクトリの外を指しうるし、結果ファイルの置き場所も
            # ずれる。`pages` は choice ではなく自由記述なので、ここで弾く。
            foreach ($p in $pageList) {
              if ($p -notmatch '^[A-Za-z0-9_.-]+$') {
                throw "pages / page に使えない文字が含まれています: '$p' (英数字・アンダースコア・ハイフン・ドットのみ)"
              }
              if ($p -eq "." -or $p -eq "..") {
                throw "pages / page が不正です: '$p'"
              }
              if (-not (Test-Path "scripts\bench\pages\$p")) {
                throw "scripts/bench/pages/$p が存在しません (指定できるのは固定ページのファイル名です)"
              }
              # Issue #231 のレビュー指摘。`page` (choice) は**シナリオ専用
              # フィクスチャを意図的に載せていない**が、`pages` は自由記述
              # なので同じ制約が効かない。
              #
              # **ここで弾きはしない。** `url` を指定すると loopback 配信
              # 自体が止まる (`serve_fixed_pages=false`) ため、弾くと
              # 「busy.html を 20 タブ開いたときのメモリを測る」のような
              # 正当な計測に逃げ道が無くなる。
              #
              # 危ないのは**結果の読み違え**の方である。これらのページは
              # ただ重いのではなく**何かをする** (CPU を回す / ダウンロード
              # を起こす / ポーリングする) ので、§21〜§34 の「ページの重さ」
              # の系列と同じ表に並ぶと、別の現象を重さの違いとして読んで
              # しまう。そこで Job Summary に出る警告を残す。
              if ($fixturePages -contains $p) {
                Write-Host "::warning::'$p' はシナリオ専用のフィクスチャです (ただ重いのではなく、CPU を回す・ダウンロードを起こす等の動作をします)。ページの重さの比較として読まないでください"
                $usedFixtures += $p
              }
            }
            # Issue #247。`?beacon=1` を付けると `busy.html` は report()
            # のたびに loopback へ 1 本投げる。`background_cpu` は
            # 前景タブ用に `&idle=1` を足すので (`browser::automation`)、
            # ここで `?` を使っておくと両方のタブが beacon を投げる —
            # 隠れている側と見えている側を `state=` で区別できる。
            $beaconQuery = ""
            if ($env:INPUT_BEACON -eq "true") { $beaconQuery = "?beacon=1" }
            "url=http://127.0.0.1:8731/$($pageList[0])$beaconQuery" >> $env:GITHUB_OUTPUT
            # 診断ステップ専用の beacon 無し URL。診断は velox を 8 秒だけ
            # 単独起動するもので、計測の自動操作とは無関係だが、beacon 付き
            # URL を渡すとその 8 秒分が計測と同じカウンタに混ざる。
            # 最初の計測ではこれに気付かず、混ざった側だけを数えていた。
            "url_plain=http://127.0.0.1:8731/$($pageList[0])" >> $env:GITHUB_OUTPUT
            "serve_fixed_pages=true" >> $env:GITHUB_OUTPUT
            "page=$($pageList -join ', ')" >> $env:GITHUB_OUTPUT
            "pages=$($pageList -join ',')" >> $env:GITHUB_OUTPUT
            "fixture_pages=$($usedFixtures -join ', ')" >> $env:GITHUB_OUTPUT
          } else {
            # 外部 URL を渡した場合、`page` / `pages` 入力は使われない。
            # 表示も「固定ページのどれか」ではなく URL そのものにする。
            "url=$url" >> $env:GITHUB_OUTPUT
            "url_plain=$url" >> $env:GITHUB_OUTPUT
            "serve_fixed_pages=false" >> $env:GITHUB_OUTPUT
            "page=$url" >> $env:GITHUB_OUTPUT
            # 1 件だけ。URL を複数受け取る入力は用意していない
            # (loopback 配信の固定ページと違い、外部 URL は比較の前提が
            # 揃っているとは限らないため)。
            "pages=" >> $env:GITHUB_OUTPUT
            "fixture_pages=" >> $env:GITHUB_OUTPUT
          }

      # ⚠️ ここは以前 `Start-Sleep -Seconds 2` の固定待ちだった。run
      # 34225449751 (本 PR の初回実行) で `python -m http.server` が 2 秒
      # では listen に間に合わず、"No connection could be made because the
      # target machine actively refused it." でジョブごと落ちた
      # (python プロセス自体は生きていた)。固定 wait は D84/D85 が統合
      # テストから追い出したのと同じ失敗の仕方をするので、**待つのではなく
      # 準備できたことを確かめる**形に変える。サーバの stdout/stderr も
      # 残しておき、起動そのものが失敗したときに理由が分かるようにする。
      - name: Serve fixed benchmark pages (default URL only)
        if: steps.bench_url.outputs.serve_fixed_pages == 'true'
        shell: pwsh
        # 入力はシェルへ直接展開せず環境変数で渡す (script injection 対策)。
        env:
          INPUT_BEACON: ${{ inputs.beacon }}
        run: |
          $ErrorActionPreference = "Stop"
          # ⚠️ **stdout/stderr をリダイレクトしない。** 一度は診断用に
          # `-RedirectStandardOutput`/`-RedirectStandardError` を付けたが、
          # それを入れた 2 つの run (34225826524 / 34226965961) の
          # `page_load_ms` が 2077ms / 2085ms と、同じ固定ページの §21.2
          # (54.10ms) から 38 倍離れた。`http.server` はシングルスレッドで
          # リクエストごとに stderr へログを 1 行書くため、書き込み先が
          # ファイルになるとその I/O が応答をブロックしうる — これが原因か
          # どうかを確かめるため、まずリダイレクトを外した状態で測り直す
          # (§26.4 付随)。起動できなかったときの診断はプロセス一覧で足りる。
          # Issue #247: beacon を数えるときだけ自前のサーバを使う。
          # **既定の計測環境を黙って変えないため**に切り替え式にしてある
          # (`scripts/bench/serve.py` の冒頭に理由を書いた)。
          # serve.py はリクエストごとのログを出さないので、§26.4 が
          # 記録した「stderr のリダイレクトで page_load_ms が 38 倍」の
          # 危険はむしろ減る方向である。
          if ($env:INPUT_BEACON -eq "true") {
            Start-Process -FilePath python -ArgumentList "scripts\bench\serve.py", "--port", "8731" `
              -WindowStyle Hidden
          } else {
            Start-Process -FilePath python -ArgumentList "-m", "http.server", "8731" `
              -WorkingDirectory "scripts\bench\pages" -WindowStyle Hidden
          }

          $deadline = (Get-Date).AddSeconds(30)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:8731/minimal.html" `
                -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop | Out-Null
              $ready = $true
              break
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $ready) {
            Write-Host "--- python プロセス ---"
            Get-Process python -ErrorAction SilentlyContinue |
              Format-Table Id, ProcessName, StartTime | Out-String | Write-Host
            Write-Host "--- 8731 を listen しているか ---"
            Get-NetTCPConnection -LocalPort 8731 -ErrorAction SilentlyContinue |
              Format-Table LocalAddress, LocalPort, State | Out-String | Write-Host
            throw "固定ページの配信サーバ (python -m http.server 8731) が 30 秒以内に応答しませんでした"
          }
          Write-Host "固定ページの配信を確認しました: http://127.0.0.1:8731/minimal.html"

      # 最大のリスク (GUI/WebView2 ウィンドウが起動できるか) の実地検証。
      # velox.exe を直接起動し、プロセス一覧と perf ログの有無を確認する —
      # Linux 側 perf-gate.yml の「Diagnose VeloX under Xvfb」ステップと
      # 同じ役割。**このステップ自体は失敗させない** (continue-on-error):
      # 起動できなくても、その事実と観測結果をログに残すことが目的であり、
      # 次の本実行ステップがどのみち同じ理由で失敗するため、ここで二重に
      # ジョブを失敗させる必要はない。
      - name: Diagnose VeloX launch on windows-latest (never fails the job)
        id: diag
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          $out = "diag\perf.jsonl"

          $env:VELOX_PERF_METRICS = "1"
          $env:VELOX_PERF_FORMAT = "json"
          $env:VELOX_PERF_OUTPUT = $out
          $env:VELOX_DATA_DIR = "diag\data"

          # ⚠️ **VeloX 自身の stdout/stderr を拾う。** これを入れるまで、
          # 「Diagnose VeloX launch」と名乗りながら**診断対象の出力を一切
          # 見ていなかった** — 起動時のエラーメッセージも、Issue #176
          # Stage 2 の WebView2 休止 API probe
          # (`ui::webview2_suspend::log_support_once`) の結果も、どこにも
          # 出ないまま捨てられていた。
          #
          # 計測ステップと違い**ここはリダイレクトして安全である**: この
          # ステップは数値を採らない診断専用で、`page_load_ms` のような
          # 測定値に影響しない (固定ページを配信する `http.server` を
          # リダイレクトしたときの §26.4 付随の問題は、測定中の I/O
          # ブロックが原因だった)。
          $stdout = "diag\velox-stdout.txt"
          $stderr = "diag\velox-stderr.txt"
          $proc = Start-Process -FilePath "target\release\velox.exe" `
            -ArgumentList "--homepage", "${{ steps.bench_url.outputs.url_plain }}" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- process snapshot ---"
          Get-Process | Where-Object {
            $_.ProcessName -match "velox|msedgewebview2"
          } | Format-Table Id, ProcessName, MainWindowTitle | Out-String | Write-Host

          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "velox.exe が診断中に自発的に終了していた (ExitCode=$($proc.ExitCode))"
          }

          # stderr を先に出す: 起動が失敗していれば理由はここにある。
          foreach ($stream in @(@{ name = "stderr"; path = $stderr },
                                @{ name = "stdout"; path = $stdout })) {
            Write-Host "--- velox $($stream.name) ---"
            if ((Test-Path $stream.path) -and (Get-Item $stream.path).Length -gt 0) {
              Get-Content $stream.path | Write-Host
            } else {
              Write-Host "(空)"
            }
          }

          Write-Host "--- perf log ---"
          if (Test-Path $out) {
            $lines = Get-Content $out
            Write-Host "records: $($lines.Count)"
            $lines | Select-Object -First 5 | Write-Host
          } else {
            Write-Host "NO perf records (perf ログファイルが作られていない = ウィンドウ作成の途中でブロックされている可能性)"
          }

      # Issue #208。`windows-latest` の `cold_startup` は
      # `startup_window_created_ms` の中央値が 644.05ms (09-07) →
      # 885.65ms (09-08) と +38% 伸びており (docs/performance-targets.md
      # §24.5)、最有力の仮説は #185 (D90: メモリ予算 700 MiB による自動タブ
      # 休止の既定 ON) である。**その検定を、Issue #208 が最初に挙げた
      # 「候補コミットへブランチを立てて workflow_dispatch を回す二分探索」
      # ではなく、同じ head・同じジョブの中の A/B 交互実行で行う。**
      #
      # なぜ A/B の方が強いか:
      #   - 二分探索は run をまたぐ比較なので、ランナー個体差・イメージ更新・
      #     WebView2 Runtime の更新といった「別 run では揃わない変数」が
      #     そのまま交絡する。§24.5 が run 1 だけ 27% 低い理由を確定できて
      #     いないのは、まさにこれが分離できていないため。
      #   - A/B は同一ジョブ・同一ビルド・同一ランナーなので、それらが丸ごと
      #     相殺される。差が出れば「その環境変数が起動時間を変えた」以外の
      #     説明が残らない。
      #   - 候補コミットへの実験用ブランチを作らずに済む。
      #
      # 既定の B 条件 `VELOX_MEMORY_BUDGET_MB=0` は #185 が既定 ON にした
      # メモリ予算シグナルだけを切る (`config::resolve_suspension` の
      # `overridable`: 明示的な `0` は既定が `Some` でも必ず `None` になる。
      # これが D90 の逃げ道として用意された値そのもの)。`settings.json` は
      # 起動時に自動生成されないため (`app::run` の `None => to_settings()`
      # は in-memory のみ)、CI のクリーンなランナーでは環境変数が
      # `apply_settings` に上書きされる心配もない。
      #
      # A → B → A → B と交互に回すのは順序効果 (ディスクキャッシュの温まり、
      # データディレクトリに溜まる履歴/セッション) を検出するため。**A 同士
      # のばらつきが A/B 差と同程度なら、その差は結論にしてはならない。**
      #
      # ⚠️ velox-bench は子プロセス (velox.exe) の環境をクリアしないので、
      # ここで設定した環境変数はそのまま計測対象に効く。裏を返すと B 条件の
      # 変数を解除し忘れると以降の A 条件が汚染されるため、必ず finally で
      # 解除する。
      - name: Run velox-bench (windows-latest, A/B)
        id: bench_run
        shell: pwsh
        # 入力はシェルへ直接展開せず環境変数で渡す (script injection 対策)。
        env:
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
          INPUT_TRIALS: ${{ inputs.trials }}
          INPUT_COMPARE_ENV: ${{ inputs.compare_env }}
          INPUT_COMMON_ENV: ${{ inputs.common_env }}
          INPUT_REPEATS: ${{ inputs.repeats }}
          EVENT_NAME: ${{ github.event_name }}
          BENCH_URL: ${{ steps.bench_url.outputs.url }}
          BENCH_PAGES: ${{ steps.bench_url.outputs.pages }}
          INPUT_BEACON: ${{ inputs.beacon }}
        run: |
          $ErrorActionPreference = "Stop"
          $scenario = $env:INPUT_SCENARIO
          if ([string]::IsNullOrWhiteSpace($scenario)) { $scenario = "cold_startup" }

          # Issue #197 / D93 子 Issue 案 A。タブ数スケーリングのように
          # **複数の点を突き合わせたい計測は、同じ run の中で採らなければ
          # ならない** (D96 決定 3: run ごとにランナーの機種が変わり、絶対値は
          # 23% 動く)。`scenarios` はそのための入力で、指定されたシナリオを
          # 1 つのジョブで順に計測する。各シナリオはそれぞれ A/B ペアを持つ。
          $scenariosRaw = $env:INPUT_SCENARIOS
          if (-not [string]::IsNullOrWhiteSpace($scenariosRaw)) {
            $scenarioList = @($scenariosRaw -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($scenarioList.Count -eq 0) {
              throw "scenarios の書式が不正です: '$scenariosRaw' (カンマ区切りのシナリオ ID を指定してください)"
            }
          } else {
            $scenarioList = @($scenario)
          }
          Write-Host "計測するシナリオ: $($scenarioList -join ', ')"
          $trials = $env:INPUT_TRIALS
          if ([string]::IsNullOrWhiteSpace($trials)) { $trials = "10" }

          # pull_request / schedule 実行では workflow_dispatch の入力が
          # 届かない (すべて空文字列 — GitHub の仕様) ので既定値をここで
          # 補う。`compare_env` は「空欄 = 比較しない」という意味を持つ
          # 入力なので、空欄を既定値で埋めてよいのは、入力そのものが存在
          # しない pull_request / schedule のときだけである。**schedule を
          # ここに足し忘れると、ジョブ自体は失敗しないが `compare_env` が
          # 空欄のまま単独計測 (A のみ) に落ち、Issue #211 項目4 が意図する
          # 「機種ごとの A/B 系列を貯める」定期計測になっていないことに
          # 誰も気付けない** — CI が緑のまま目的を達成しない、という壊れ方
          # なので、pull_request と同じ既定値をここで明示的に補う。
          $compareEnv = $env:INPUT_COMPARE_ENV
          $commonEnv = $env:INPUT_COMMON_ENV
          $repeatsRaw = $env:INPUT_REPEATS
          if ($env:EVENT_NAME -eq "pull_request" -or $env:EVENT_NAME -eq "schedule") {
            $compareEnv = "VELOX_MEMORY_BUDGET_MB=0"
            $commonEnv = ""
            $repeatsRaw = "2"
          }
          if ([string]::IsNullOrWhiteSpace($repeatsRaw)) { $repeatsRaw = "2" }
          $repeats = 0
          if (-not [int]::TryParse($repeatsRaw, [ref]$repeats) -or $repeats -lt 1) {
            throw "repeats は 1 以上の整数で指定してください (受け取った値: '$repeatsRaw')"
          }

          # Issue #211 項目4 の後半 / D106 Revisit condition (1)。
          # 取り込みジョブ (ingest-history) が「どの条件で測った数値か」を
          # 系列 ID に埋めるために要る。**既定値の補完はこのステップの中で
          # 行われる**ので、`inputs.compare_env` を ingest 側で読み直しては
          # ならない — schedule 実行では常に空文字列になり、B 腕の結果が
          # 「条件不明」として取り込まれなくなる (`perf_history_plan.py` の
          # RefusalTest が固定している挙動)。
          "compare_env=$compareEnv" >> $env:GITHUB_OUTPUT
          "common_env=$commonEnv" >> $env:GITHUB_OUTPUT

          # "KEY=VALUE;KEY2=VALUE2" を実際の環境変数として設定し、設定した
          # 名前の一覧を返す (解除に使う)。
          function Set-EnvFromSpec([string] $spec) {
            $names = @()
            foreach ($pair in $spec -split ';') {
              $entry = $pair.Trim()
              if ([string]::IsNullOrWhiteSpace($entry)) { continue }
              $index = $entry.IndexOf('=')
              if ($index -lt 1) {
                throw "compare_env の書式が不正です: '$entry' (KEY=VALUE をセミコロンで区切ってください)"
              }
              $name = $entry.Substring(0, $index).Trim()
              $value = $entry.Substring($index + 1).Trim()
              Set-Item -Path "Env:$name" -Value $value
              $names += $name
            }
            if ($names.Count -eq 0) {
              throw "compare_env に有効な KEY=VALUE がありません: '$spec'"
            }
            return $names
          }

          # Issue #176 Stage 3 / D145 Revisit condition (1) / D147。
          # `--keep-logs` で**各試行の perf ログ (JSON Lines) を捨てずに残す**。
          # 結果 JSON は中央値などの集計値しか持たないため、§46 の
          # 「`mark` の後に 5 秒ごとに 4 タブずつ休止が続く」は遅延の分布
          # としてしか見えず、1 回のスイープが何タブを要求したのか (= 仮説
          # 「`ESTIMATED_BYTES_PER_TAB` が Windows では過大で、要求が小さく
          # 出て収束に回数が要る」の検証材料) は時系列でしか確かめられない。
          # 置き場は `results\perf-logs\` — 後段のサマリと ingest は
          # `results` 直下の `*-windows*.json` しか読まないので
          # (`Get-ChildItem -Filter`、`perf_history_plan.py` の `glob`)、
          # サブディレクトリの `.jsonl` が集計に混ざることはない。artifact
          # には `results/` ごと入る。
          function Invoke-Bench([string] $sc, [string] $url, [string] $outfile, [string] $label) {
            Write-Host "=== $label -> $outfile ==="
            & target\release\velox-bench.exe run `
              --scenario $sc `
              --trials $trials `
              --url "$url" `
              --output $outfile `
              --keep-logs results\perf-logs
            if ($LASTEXITCODE -ne 0) {
              throw "velox-bench run が失敗しました (条件: $label, exit code $LASTEXITCODE) — 上の診断ステップのログを確認してください"
            }
          }

          # A/B の両方に共通で効かせる設定 (Issue #197)。**測定条件そのものを
          # 成立させるためのもの**で、A と B の差には現れない。例:
          # `tabs_N` のスクリプトは 9 タブを連続で開いて 3 秒待って quit する
          # ため、プロセスの生存は約 6 秒しかない。休止判定に使うメモリ
          # サンプラは `sleep(interval)` を**先に**実行する既定 5 秒周期
          # なので、そのままではサンプルが 0〜1 回しか取れず、**メモリ予算は
          # 原理的に発動しない** (run 34227483724 の tabs_10 A/B が差 -0.4%
          # に終わった理由がこれ)。`VELOX_MEMORY_CHECK_INTERVAL_MS=500` の
          # ように周期を詰めて初めて、予算の有無が結果に出る。
          if (-not [string]::IsNullOrWhiteSpace($commonEnv)) {
            Write-Host "A/B 共通の環境変数: $commonEnv"
            Set-EnvFromSpec $commonEnv | Out-Null
          }

          # A/B 比較表を作る後段のステップは別プロセスなので、ここで解決した
          # 値 (pull_request 実行時の既定を含む) をステップ出力で渡す。
          "compare_env<<VELOX_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $compareEnv | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VELOX_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Issue #231。計測するページの一覧。`pages` 未指定 (= 従来の
          # 1 ページ) と外部 URL 指定のときは 1 件だけになり、その場合の
          # 挙動・ファイル名は**従来と 1 バイトも変わらない** (下記
          # `Get-ResultPrefix` を参照)。
          $pagesRaw = $env:BENCH_PAGES
          if (-not [string]::IsNullOrWhiteSpace($pagesRaw)) {
            $pageList = @($pagesRaw -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          } else {
            # 外部 URL 指定。ページ名という概念が無いので 1 件の空文字列で
            # 回し、URL は BENCH_URL をそのまま使う。
            $pageList = @("")
          }
          Write-Host "計測するページ: $(($pageList | ForEach-Object { if ($_) { $_ } else { $env:BENCH_URL } }) -join ', ')"

          # 結果ファイル名の接頭辞。
          #
          # ⚠️ **1 ページのときは接頭辞をシナリオ名のままにする。**
          # `cold_startup-windows.json` のような名前は docs
          # (§21.x / §26.x) から参照されており、複数ページ対応のために
          # 全 run の名前を変えると、過去の記録との対応が取れなくなる。
          # ページを名前に含めるのは**含めないと衝突する場合だけ**に絞る。
          function Get-ResultPrefix([string] $sc, [string] $page) {
            if ($pageList.Count -le 1) { return $sc }
            # `minimal.html` -> `minimal`。`@` はシナリオ ID に現れない
            # ので、後段のサマリはここで分解できる。
            $slug = [System.IO.Path]::GetFileNameWithoutExtension($page)
            return "$sc@$slug"
          }

          # Issue #247。腕ごとに beacon の集計を読んで空にするヘルパ。
          # `/beacon-reset` は「返してから空にする」ので、返ってきた値が
          # ちょうどその腕の分になる。
          #
          # **beacon が無効なときは何もしない。** 既定の計測では serve.py
          # 自体が動いておらず、叩けば必ず失敗するため。
          #
          # 失敗してもジョブは落とさない。これは診断であって計測結果
          # そのものではない (このステップが落ちると 16 分のベンチが
          # 丸ごと無駄になる)。
          function Reset-Beacons() {
            if ($env:INPUT_BEACON -ne "true") { return $null }
            try {
              return (Invoke-WebRequest -Uri "http://127.0.0.1:8731/beacon-reset" `
                -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop).Content
            } catch {
              Write-Host "::warning::beacon の区切りに失敗しました: $_"
              return $null
            }
          }

          function Write-BeaconArm([string] $label) {
            $body = Reset-Beacons
            if ($null -eq $body) { return }
            Write-Host "  beacon [$label] $body"
          }

          # Issue #247。`bench_url` の `url` 出力には beacon クエリが
          # 付いているが、**固定ページを配信するときこの分岐は使われない**
          # — `$pg` が常に非空になるため、素の URL がここで組み直される。
          # 最初の計測ではそれに気付かず、beacon を数えたつもりで
          # 「診断ステップの単発起動」だけを数えていた (§41 / D125 を撤回)。
          # クエリの組み立ては `bench_url` ステップと同じ規則で行う。
          $beaconQuery = ""
          if ($env:INPUT_BEACON -eq "true") { $beaconQuery = "?beacon=1" }

          foreach ($pg in $pageList) {
            $url = if ($pg) { "http://127.0.0.1:8731/$pg$beaconQuery" } else { $env:BENCH_URL }
            foreach ($sc in $scenarioList) {
              $prefix = Get-ResultPrefix $sc $pg
              $tag = if ($pageList.Count -le 1) { $sc } else { "$sc / $pg" }
              if ([string]::IsNullOrWhiteSpace($compareEnv)) {
                # 従来どおりの単独計測。ファイル名も従来のまま
                # (§21/§24 の結果と同じ名前で artifact に並ぶ)。
                Invoke-Bench $sc $url "results\$prefix-windows.json" "[$tag] A (既定)"
              } else {
                Write-Host "[$tag] A/B 比較: B 条件 = '$compareEnv' / ペア数 = $repeats"
                # Issue #247。腕の切り替えで beacon の集計を区切る。
                # **区切らないと A と B の beacon が同じバケットに
                # 積み上がり、low と normal を分離できない** (§42.5)。
                # 直前の残り (診断ステップの分など) もここで捨てる。
                Reset-Beacons | Out-Null
                for ($r = 1; $r -le $repeats; $r++) {
                  Invoke-Bench $sc $url "results\$prefix-windows-baseline-$r.json" "[$tag] A (既定) #$r"
                  Write-BeaconArm "[$tag] A (既定) #$r"
                  $names = Set-EnvFromSpec $compareEnv
                  try {
                    Invoke-Bench $sc $url "results\$prefix-windows-compare-$r.json" "[$tag] B ($compareEnv) #$r"
                    Write-BeaconArm "[$tag] B ($compareEnv) #$r"
                  } finally {
                    foreach ($name in $names) {
                      Remove-Item -Path "Env:$name" -ErrorAction SilentlyContinue
                    }
                  }
                }
              }
            }
          }

      # Issue #247。**ブラウザに触れずに**背景タブの実行状況を読む唯一の
      # 経路。`busy.html` は report() のたびに `beacon?state=..&f=..&t=..`
      # を投げ、`serve.py` がそれを state ごとに数えている。
      #
      # 見るのは `advanced_frames` / `advanced_ticks` — **ページ実体
      # (`id=`) ごとの「最後 − 最初」の合計**である。`state=hidden` の側で
      # これが 0 なら、隠れているタブで rAF / setInterval が一度も進まな
      # かったことになる。`count` も一緒に出しているのは、beacon が 1 件
      # しか来ていない (差が 0 になるのは当然) 場合と区別するため。
      # `instances` は実体の数で、背景タブが 12 個あるのに 1 なら
      # **`id=` が届いていない**ことを疑う。
      #
      # `heap_mean` / `heap_max` は `performance.memory.usedJSHeapSize`。
      # `LOW` が何を縮めたのかの 3 候補のうち**ページから見える唯一の
      # もの**である (D129 決定6)。列ごと無い場合は 1 件も届かなかった
      # ということで、「ヒープが 0」ではない。
      #
      # ⚠️ **A/B 比較のときこのステップは空を返す。** 腕ごとに
      # `/beacon-reset` で区切っており (§42.5)、**読むべき数字は上の
      # ベンチステップに出ている `beacon [...] {...}` の行**である。
      # ここに出るのは最後の腕より後に届いた分だけになる。
      #
      # 集計の取得に失敗してもジョブは落とさない。これは診断であって
      # 計測結果そのものではない。
      - name: Show background beacon counts (Issue #247)
        if: steps.bench_url.outputs.serve_fixed_pages == 'true' && inputs.beacon
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $summary = Invoke-WebRequest -Uri "http://127.0.0.1:8731/beacon-summary" `
              -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
            Write-Host "--- beacon 集計 (state ごと) ---"
            Write-Host $summary.Content
            $parsed = $summary.Content | ConvertFrom-Json
            foreach ($state in $parsed.PSObject.Properties.Name) {
              $e = $parsed.$state
              Write-Host ("{0}: count={1} frames {2} -> {3} (+{4}) / ticks {5} -> {6} (+{7})" -f `
                $state, $e.count, $e.first_frames, $e.last_frames, $e.advanced_frames, `
                $e.first_ticks, $e.last_ticks, $e.advanced_ticks)
            }
          } catch {
            Write-Host "beacon 集計を取得できませんでした: $_"
          }

      # Issue #176 Stage 3 / D145 Revisit condition (1) / D147 / D148。
      # `--keep-logs` で残した試行ごとの生ログから、**メモリ判定 1 回ごとに
      # 何タブ休止し、その直前の rss が予算をどれだけ超えていたか**を表に
      # して Job Summary に出す。§46.5 の仮説 2 (「`ESTIMATED_BYTES_PER_TAB`
      # = 64 MiB が Windows の実態より大きく、1 回の要求が小さく出て収束に
      # 回数が要る」) は、この「要求タブ数 vs 実際の休止数」の並びでしか
      # 確かめられない。
      #
      # artifact に入る生ログをダウンロードして手元で読むのが本来の経路
      # だが、**Job Summary に出しておけば run ページを開くだけで読める。**
      # 予算は perf ログに書かれていないので、`env_info` の RAM から
      # Rust 側と同じ式で求める (`perf_log_timeline.py` の docstring)。
      #
      # 診断であって計測結果そのものではないので、失敗してもジョブは
      # 落とさない。`--only-with-suspends` で、休止が起きないシナリオ
      # (`cold_startup` など) では表が空で膨らまないようにしている。
      - name: Show suspend sweep timeline (D148)
        if: always()
        shell: pwsh
        continue-on-error: true
        env:
          RAM_BYTES: ${{ steps.env_info.outputs.ram_bytes }}
        run: |
          if (-not (Test-Path "results\perf-logs")) {
            Write-Host "results\perf-logs がありません (velox-bench run が 1 度も走っていない可能性)"
            exit 0
          }
          $timeline = python .github/scripts/perf_log_timeline.py results\perf-logs `
            --ram-bytes $env:RAM_BYTES --markdown --only-with-suspends
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::休止スイープの時系列を作れませんでした (exit code $LASTEXITCODE)"
            exit 0
          }
          $text = $timeline -join "`n"
          Write-Host $text
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $text

      - name: Show result summary
        if: always()
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path results -Filter "*-windows*.json" -ErrorAction SilentlyContinue |
            Sort-Object Name)
          if ($files.Count -eq 0) {
            Write-Host "結果ファイルが生成されていません (velox-bench run が失敗した可能性)"
            exit 0
          }
          foreach ($file in $files) {
            Write-Host "--- $($file.Name) ---"
            Get-Content $file.FullName | Write-Host
          }

      # Issue #182 (docs/decisions.md D92)。§21 の初回実測で
      # startup_first_load_ms 716.7ms のうち startup_window_created_ms が
      # 644.1ms を占めることが分かり、#182 でその区間を 4 つの中間チェック
      # ポイントに分解した。結果 JSON は全チェックポイントを「プロセス開始
      # からの累積 ms」で持つため、区間ごとの長さを見るには隣り合う値を
      # 引き算する必要がある。毎回それを手でやるのは面倒なだけでなく間違え
      # やすいので、ここで Job Summary に表として出す。
      #
      # ⚠️ **この差分は「区間の中央値」ではなく「累積中央値どうしの差」**。
      # 各メトリクスの中央値は別々の試行から来うるため、両者は一致しない。
      # どちらの区間が支配的かを一目で見るには十分だが、区間そのものの
      # 分布を論じるなら試行ごとに引き算した値を集計すること
      # (docs/performance-targets.md §24.2 に手順がある)。
      #
      # 後半の A/B 比較表が Issue #208 の本題。こちらは累積値どうしを
      # 条件間で比べるだけなので、上の注意は当てはまらない。
      #
      # 本実行 (velox-bench run) が失敗しても結果の取りこぼしを増やさない
      # よう、常に走り、単独では決してジョブを落とさない。
      - name: Startup breakdown / A-B summary (Issue #182, #208)
        if: always()
        continue-on-error: true
        shell: pwsh
        # bench_run が失敗していれば空になる (表の見出しが空欄になるだけで、
        # 内訳表そのものは出せる)。
        env:
          COMPARE_ENV: ${{ steps.bench_run.outputs.compare_env }}
          COMMON_ENV: ${{ inputs.common_env }}
          RUNNER_CPU: ${{ steps.env_info.outputs.cpu }}
          RUNNER_CORES: ${{ steps.env_info.outputs.cores }}
          RUNNER_RAM_GIB: ${{ steps.env_info.outputs.ram_gib }}
          # Issue #176。**どのページで測ったかは数値の意味を変える** —
          # とくに page_load_ms は minimal.html (229 バイト) と
          # dom_heavy.html (99 KB) で桁が変わりうる。ランナー情報と同じ
          # 理由 (D96: 条件が違う数値を並べさせない) でサマリに出す。
          BENCH_PAGE: ${{ steps.bench_url.outputs.page }}
          # Issue #231。表をページごとに分けるために、解決済みの一覧を
          # **入力順のまま**受け取る (アルファベット順に並べ替えない —
          # 指定した順に読めた方が突き合わせやすい)。
          BENCH_PAGES: ${{ steps.bench_url.outputs.pages }}
          # Issue #231 のレビュー指摘。フィクスチャを計測対象にした run は、
          # **その表を読む人の目の前**に注意書きを出す (ログの警告だけでは
          # 後から表だけを見た人に届かない)。
          BENCH_FIXTURE_PAGES: ${{ steps.bench_url.outputs.fixture_pages }}
        run: |
          $ErrorActionPreference = "Continue"
          $files = @(Get-ChildItem -Path results -Filter "*-windows*.json" -ErrorAction SilentlyContinue |
            Sort-Object Name)
          if ($files.Count -eq 0) {
            Write-Host "結果ファイルが無いため起動内訳をスキップします"
            exit 0
          }
          # 到達順。process_start は 0ms の起点なので表の先頭に置く。
          $checkpoints = @(
            @{ key = "startup_event_loop_ms";             label = "event_loop (tao のイベントループ生成)" },
            @{ key = "startup_pre_window_setup_ms";       label = "pre_window_setup (VeloX 自身の Rust セットアップ)" },
            @{ key = "startup_native_window_ms";          label = "native_window (tao のネイティブウィンドウ生成)" },
            @{ key = "startup_toolbar_webview_ms";        label = "toolbar_webview (最初の webview = エンジン初期化)" },
            @{ key = "startup_window_created_ms";         label = "window_created (content webview まで完了)" },
            @{ key = "startup_toolbar_ready_ms";          label = "toolbar_ready" },
            @{ key = "startup_first_load_ms";             label = "first_load" }
          )
          $lines = @()
          foreach ($file in $files) {
            $result = Get-Content $file.FullName -Raw | ConvertFrom-Json
            $lines += "### 起動の内訳 — ``$($file.Name)`` (Issue #182)"
            $lines += ""
            $lines += "累積中央値と、隣接する累積中央値の差。**差は区間ごとの中央値ではない** (各中央値は別々の試行から来うる)。"
            $lines += ""
            $lines += "| チェックポイント | 累積 median (ms) | 直前との差 (ms) |"
            $lines += "| --- | ---: | ---: |"
            $previous = 0.0
            $missing = @()
            foreach ($cp in $checkpoints) {
              $stats = $result.metrics.($cp.key)
              if ($null -eq $stats) {
                $missing += $cp.key
                continue
              }
              $median = [double]$stats.median
              $lines += "| $($cp.label) | $([math]::Round($median, 2)) | $([math]::Round($median - $previous, 2)) |"
              $previous = $median
            }
            if ($missing.Count -gt 0) {
              $lines += ""
              $lines += "> 欠損: $($missing -join ', ') — このシナリオでは記録されないか、#182 より前のビルドの結果ファイルです。"
            }
            $lines += ""
          }

          # --- Issue #208 / #197: シナリオごとの A/B 比較 ----------------
          #
          # ⚠️ **シナリオごとにグループ化する。** `scenarios` 入力で複数
          # シナリオを 1 つの run で回せるようになったため (Issue #197 /
          # D93 子 Issue 案 A)、全ファイルをまとめて baseline/compare の
          # 2 群に分けると別シナリオの値が混ざってしまう。
          function Get-Medians([object[]] $fileList, [string] $key) {
            $values = @()
            foreach ($f in $fileList) {
              $parsed = Get-Content $f.FullName -Raw | ConvertFrom-Json
              $stats = $parsed.metrics.($key)
              if ($null -ne $stats) { $values += [double]$stats.median }
            }
            return $values
          }

          # ファイル名 "<scenario>-windows-(baseline|compare)-<n>.json" から
          # シナリオ名を取り出す。
          $abPattern = '^(.+)-windows-(baseline|compare)-\d+\.json$'
          $abFiles = @($files | Where-Object { $_.Name -match $abPattern })
          $scenarioNames = @($abFiles | ForEach-Object {
            if ($_.Name -match $abPattern) { $Matches[1] }
          } | Select-Object -Unique)

          # Issue #231。複数ページを 1 run で回すと、グループ名は
          # `<scenario>@<page-slug>` になる (1 ページのときは従来どおり
          # シナリオ名のまま)。以降は必ずここで分解してから扱う。
          function Split-GroupName([string] $name) {
            $i = $name.IndexOf('@')
            if ($i -lt 0) { return @{ scenario = $name; page = "" } }
            return @{
              scenario = $name.Substring(0, $i)
              page     = $name.Substring($i + 1)
            }
          }

          # ページの並び順は**入力順**にする (アルファベット順ではない)。
          # `minimal.html,dom_heavy.html` と指定したら軽い方から読める。
          $pageOrder = @()
          if (-not [string]::IsNullOrWhiteSpace($env:BENCH_PAGES)) {
            $pageOrder = @($env:BENCH_PAGES -split ',' |
              ForEach-Object { [System.IO.Path]::GetFileNameWithoutExtension($_.Trim()) })
          }
          function Get-PageRank([string] $slug) {
            if ([string]::IsNullOrWhiteSpace($slug)) { return -1 }
            $i = $pageOrder.IndexOf($slug)
            if ($i -lt 0) { return [int]::MaxValue }
            return $i
          }

          # tabs_N / tabs_hold_N / tabs_hold_resume_N は数値順に並べる
          # (スケーリングを読むため)。それ以外は名前順。**ページが違うもの
          # は先にページで束ねる** — 表もページごとに分かれるので、並び順も
          # それに合わせないと読み手が行き来することになる。
          #
          # ⚠️ **プレフィックスを 1 段足したら、この正規表現も足すこと。**
          # `tabs_hold_` を勘定に入れ忘れて `tabs_hold_20` が名前順に落ちた
          # 事故が run 34247895418 で実際に起きている。`tabs_hold_resume_`
          # (Issue #176) でも同じ漏れをやりかけた — `hold_` の直後に数字を
          # 要求する形だと `hold_resume_20` で外れ、`_1, _10, _20, _5, _50`
          # という文字列順になる。`tabs_hold_bounce_` (Issue #279) も同じ
          # 形の罠を持つので同じ選択肢グループに入れてある。ページ接尾辞
          # (`@minimal`) を足した Issue #231 でも同じ罠があるので、
          # **分解してからシナリオ名だけを正規表現にかける。**
          $scenarioNames = @($scenarioNames | Sort-Object {
            Get-PageRank (Split-GroupName $_).page
          }, {
            $sc = (Split-GroupName $_).scenario
            if ($sc -match '^tabs_(?:hold_(?:resume_|bounce_)?)?(\d+)$') { [int]$Matches[1] } else { [int]::MaxValue }
          }, { $_ })

          $compareKeys = @(
            "startup_native_window_ms",
            "startup_toolbar_webview_ms",
            "startup_window_created_ms",
            "startup_toolbar_ready_ms",
            "startup_first_load_ms",
            "page_load_ms",
            "rss_total_bytes",
            # Issue #176 Stage 1 / D118。**VeloX 自身とエンジンの内訳。**
            # `rss_total_bytes` がどちらの側で動いたのかは総量だけでは
            # 分からない — 休止はエンジンのプロセスを落とす操作なので、
            # 効いていれば `rss_engine_bytes` が動き `rss_browser_bytes` は
            # ほぼ変わらないはずである。そうなっていない A/B は、予算とは
            # 別の何かが動いている。
            "rss_browser_bytes",
            "rss_engine_bytes",
            # D97 Revisit condition (1)。**「休止で WebView2 のプロセスが
            # 実際に減っているか」**を見るための鍵。suspend_tab は
            # tab.webview.take() で webview を drop するだけなので、
            # プロセスまで消えるかどうかは OS とエンジン次第であり、
            # RSS の減少だけでは区別がつかない。
            #   - プロセス数が減っている   -> プロセス単位で回収できている
            #   - 減っていない             -> webview は落ちてもプロセスは残る
            # 後者なら #176 Memory Budget Manager の設計課題になる。
            "rss_process_count",
            # D97 Revisit condition (4) / D105。**RSS の隣に「何タブ休止した
            # 結果か」を出すための鍵。** 616.8 MiB のような着地値だけでは
            # 休止による状態喪失 (再読み込みの発生) のコストが読み取れない
            # ため、`tab_suspend` イベントの件数 (`suspended_tab_count`、
            # `MetricKey::extract` が 1 trial につき 1 サンプルに畳んだ値)
            # を並べる。
            "suspended_tab_count",
            # Issue #176 Stage 1。**休止の「対価」の側**を測る鍵。
            # `tabs_hold_resume_N` (Scenario::TabCountMemoryResume) は
            # `tabs_hold_N` と同じ手順で落ち着かせたあと、最長未使用の
            # タブへ戻る。予算が休止したタブへの switch が
            # `tab_resume` を生むので、ここに値が出る。
            #
            # ⚠️ **他のシナリオでは行ごと出ない。** 戻る操作をしない
            # シナリオでは `tab_resume` イベント自体が発生せず、この
            # ループは値が 0 件の鍵を `continue` で飛ばす。行が無いのは
            # 計測の失敗ではなく「そのシナリオは復帰を測っていない」と
            # いう意味である。逆に `tabs_hold_resume_N` で行が出ない
            # ときは**予算が 1 つも休止しなかった**ことを意味する
            # (生きているタブへの switch は `tab_switch` になる)。
            "tab_resume_ms",
            # Issue #279 / D110 Revisit condition (3)。**「揺り戻し」— 戻した
            # タブが次のメモリ判定で再び休止されるか**を見るための鍵。
            # `tabs_hold_bounce_N` (Scenario::TabCountMemoryBounce) は
            # `tabs_hold_resume_N` と同じ手順で戻したあと、既定の周期で
            # 判定が 2 回以上走る長さだけ追加で待つ。
            #
            # ⚠️ **`tabs_hold_bounce_N` の `suspended_tab_count` は揺り戻し分
            # を含む合計である。** 「落ち着くまでの休止数」を読みたいときは
            # `suspended_tab_count - tab_resuspend_count` を計算すること —
            # 後者が `mark` (= 戻すラウンドの直前) より後だけの休止件数
            # なので、差が「戻す前に落ち着いていた休止数」になる。
            "tab_resuspend_count",
            # 上記のうち、戻したのと同じタブが再び休止された件数
            # (`MetricKey::TabResuspendRevisitedCount`) — 「本当に往復した」
            # ケースだけを数える。
            "tab_resuspend_revisited_count",
            # 揺り戻しが起きるまでの速さ。既定のメモリチェック周期 (5 秒)
            # で量子化されるので、gate の対象としてではなく目安として読む
            # こと (`MetricKey::TabResuspendDelayMs` の doc comment 参照)。
            "tab_resuspend_delay_ms"
          )

          if ($scenarioNames.Count -gt 0) {
            $lines += "### A/B 比較 (Issue #208 / #197)"
            $lines += ""
            $lines += "A = 既定のまま / B = ``$env:COMPARE_ENV`` を設定して起動。同一ジョブ・同一ビルド・同一ランナーで交互に計測しているため、ランナー個体差やイメージ更新は相殺される。"
            $lines += ""
            if (-not [string]::IsNullOrWhiteSpace($env:COMMON_ENV)) {
              $lines += "A/B 共通で設定した環境変数: ``$env:COMMON_ENV`` (測定条件を成立させるためのもので、A と B の差には現れない)"
              $lines += ""
            }
            $lines += "計測したランナー: $env:RUNNER_CPU / $env:RUNNER_CORES 論理コア / RAM $env:RUNNER_RAM_GIB GiB。**``windows-latest`` は run ごとに別スペックのマシンが割り当てられる (§26.4 事実 2)。この行が違う run どうしの絶対値を比較してはならない。**"
            $lines += ""
            if ($pageOrder.Count -gt 1) {
              # Issue #231。ページを 1 run に収めたときだけ出る案内。
              # **「同一 run 内だから比較してよい」と「表はページごとに
              # 分けてある」を両方言う。** 前者だけだと、読み手が別ページの
              # 行を目で並べて比べにかかる。
              $lines += "計測ページ: ``$env:BENCH_PAGE`` (Issue #231: 同一 run 内で複数ページを計測)。**ページ間の比較はこの run の中でだけ成立する** — 機種差が混ざらないためであり、これがこの入力を足した理由そのものである (D96 決定 3)。"
              $lines += ""
              $lines += "⚠️ **表はページごとに分けてある。見出しの ``(ページ名)`` が違う表の行を、同じ列だからといって並べて読まないこと。** 比べるなら、同じシナリオ・違うページの表を突き合わせる。"
              $lines += ""
            } else {
              $lines += "計測ページ: ``$env:BENCH_PAGE``。**記録済みの値 (§21〜§31) はすべて ``minimal.html`` のもの。ページが違う run の ``page_load_ms`` を並べてはならない** (ランナーが違う run の絶対値を並べてはならないのと同じ理由)。"
              $lines += ""
            }
            if (-not [string]::IsNullOrWhiteSpace($env:BENCH_FIXTURE_PAGES)) {
              $lines += "⚠️ **``$env:BENCH_FIXTURE_PAGES`` はシナリオ専用のフィクスチャである。** ただ重いのではなく**何かをする**ページ (CPU を回す / ダウンロードを起こす / ポーリングする) なので、``page`` の選択肢には載せていない。**この行の値を §21〜§34 の「ページの重さ」の系列と並べて読まないこと** — 別の現象を重さの違いとして読むことになる。"
              $lines += ""
            }
            $lines += "**A 同士のばらつき (下表の「A の各 run」) が A/B 差と同程度なら、その差は結論にしてはならない。**"
            $lines += ""
            $lines += "片側が ``-`` の行は、**その条件ではそのメトリクスが原理的に発生しない**ことを意味する (例: ``tab_resume_ms`` は B = 予算 OFF では休止が起きないため復帰も起きない)。差と比も ``-`` にしてある — 0 として引き算すると、存在しないことを「速い」と読み違える表になるため。"
            $lines += ""
          }

          foreach ($sc in $scenarioNames) {
            $baselineFiles = @($abFiles | Where-Object { $_.Name -like "$sc-windows-baseline-*" })
            $compareFiles = @($abFiles | Where-Object { $_.Name -like "$sc-windows-compare-*" })
            if ($baselineFiles.Count -eq 0 -or $compareFiles.Count -eq 0) { continue }
            $parts = Split-GroupName $sc
            if ($parts.page) {
              $lines += "#### ``$($parts.scenario)`` ($($parts.page))"
            } else {
              $lines += "#### ``$sc``"
            }
            $lines += ""
            $lines += "| メトリクス | A の各 run の median | A 平均 | B の各 run の median | B 平均 | 差 (B-A) | 比 (B/A) |"
            $lines += "| --- | --- | ---: | --- | ---: | ---: | ---: |"
            foreach ($key in $compareKeys) {
              # 単一要素や空を返したときに配列で扱えるよう @() で包む。
              $a = @(Get-Medians $baselineFiles $key)
              $b = @(Get-Medians $compareFiles $key)
              # 両側とも無いメトリクスだけを飛ばす。**片側だけのメトリクス
              # は行ごと消さずに出す** (Issue #176)。
              #
              # `tab_resume_ms` がこれに当たる: B (`VELOX_MEMORY_BUDGET_MB=0`)
              # では予算が何も休止しないので復帰も起きず、B 側は構造的に
              # 常に 0 件になる。両側必須のままだと、**A 側に値があっても
              # 行が出ない** — run 34669308096 で実際にそうなり、
              # `tabs_hold_resume_N` を回したのに復帰コストが 1 つも
              # 表示されなかった。
              #
              # 片側が空のときは差と比を出さない ("-")。B が 0 件なのは
              # 「B の値が 0」ではなく「B には存在しない」であり、
              # 0 として引き算すると**休止しなかった条件の方が速いかの
              # ような表**になってしまう。
              if ($a.Count -eq 0 -and $b.Count -eq 0) { continue }
              $digits = if ($key -eq "rss_total_bytes" -or $key -eq "rss_process_count" -or $key -eq "suspended_tab_count" -or $key -eq "tab_resuspend_count" -or $key -eq "tab_resuspend_revisited_count") { 0 } else { 2 }
              $aList = if ($a.Count -gt 0) { ($a | ForEach-Object { [math]::Round($_, $digits) }) -join ", " } else { "-" }
              $bList = if ($b.Count -gt 0) { ($b | ForEach-Object { [math]::Round($_, $digits) }) -join ", " } else { "-" }
              $aAvgText = if ($a.Count -gt 0) { [math]::Round(($a | Measure-Object -Average).Average, $digits) } else { "-" }
              $bAvgText = if ($b.Count -gt 0) { [math]::Round(($b | Measure-Object -Average).Average, $digits) } else { "-" }
              if ($a.Count -gt 0 -and $b.Count -gt 0) {
                $aAvg = ($a | Measure-Object -Average).Average
                $bAvg = ($b | Measure-Object -Average).Average
                $diffText = [math]::Round($bAvg - $aAvg, $digits)
                $ratioText = if ($aAvg -ne 0) { [math]::Round($bAvg / $aAvg, 3) } else { "n/a" }
              } else {
                $diffText = "-"
                $ratioText = "-"
              }
              $lines += "| $key | $aList | $aAvgText | $bList | $bAvgText | $diffText | $ratioText |"
            }
            $lines += ""
          }

          # --- タブ数スケーリング (Issue #197 / D93 子 Issue 案 A) --------
          #
          # 複数シナリオを 1 run で回したときだけ出す。**同一 run 内なので
          # ここに並ぶ値どうしは比較してよい** — それが `scenarios` 入力を
          # 足した理由そのものである (D96 決定 3)。
          # ⚠️ `tabs_hold_N` を含めること。`^tabs_\d+$` だけだと
          # `tabs_hold_20` がマッチせず、**スケーリング表が丸ごと出ない**
          # (run 34247895418 で実際にそうなった)。
          #
          # ⚠️ **逆に `tabs_hold_resume_N` は意図的に外してある** (Issue
          # #176)。上のソート用の正規表現とはここだけ食い違うが、これは
          # 漏れではない: `tabs_hold_resume_N` の `rss_total_bytes` は
          # **復帰ラウンドの後**の窓で測った値で、`tabs_hold_N` の定常値
          # とは別物である (実測で 527.9 → 666.4 MiB)。同じスケーリング
          # 表に並べると、`tabs_N` と `tabs_hold_N` を混ぜてはならない
          # (D97) のと同じ誤読を招く。
          #
          # ⚠️ `tabs_hold_bounce_N` (Issue #279) も同じ理由で除外**され
          # ている** — この正規表現を変更したわけではなく、`hold_` の直後に
          # 数字を要求する形のままなので `tabs_hold_bounce_20` はそもそも
          # マッチしない。`tabs_hold_bounce_N` の `rss_total_bytes` は
          # `tabs_hold_resume_N` よりさらに後 (揺り戻しの待ちの後) の窓の
          # 値で、定常値からより遠いので、この除外は意図の通りである。
          #
          # ⚠️ **ページをまたいだ行を 1 つの表に並べない** (Issue #231)。
          # 同一 run 内ならページ差は機種差を含まないので比較できるが、
          # `tabs_N` と `tabs_hold_N` を混ぜない (D97) のと同じ理由で、
          # **測定条件が違う系統を同じ表の行として並べると誤読を生む** —
          # RSS の絶対値はページの重さで動くので、タブ数スケーリングの
          # 傾きを読む表にページの違う行が混ざると傾きが読めなくなる。
          # そこでページごとに表を分ける。
          $tabScenarios = @($scenarioNames |
            Where-Object { (Split-GroupName $_).scenario -match '^tabs_(?:hold_)?\d+$' })
          $tabPages = @($tabScenarios | ForEach-Object { (Split-GroupName $_).page } |
            Select-Object -Unique | Sort-Object { Get-PageRank $_ })
          foreach ($tabPage in $tabPages) {
            $tabScenariosOnPage = @($tabScenarios | Where-Object { (Split-GroupName $_).page -eq $tabPage })
            if ($tabScenariosOnPage.Count -gt 1) {
              if ($tabPage) {
                $lines += "### タブ数スケーリング — $tabPage (Issue #197 / #231)"
              } else {
                $lines += "### タブ数スケーリング (Issue #197)"
              }
              $lines += ""
              $lines += "``rss_total_bytes`` の平均を MiB で、``rss_process_count`` の平均をプロセス数で示す。**同一 run 内の比較なので、この表の行どうしは並べて読んでよい。**"
              $lines += ""
              $lines += "プロセス数の列は **休止で WebView2 のプロセスが実際に減っているか** を見るためのもの (D97 Revisit (1))。``suspend_tab`` は webview を drop するだけなので、プロセスまで消えるかは RSS だけでは区別がつかない。"
              $lines += ""
              $lines += "休止タブ数の列は **616.8 MiB のような着地値が背景タブを何個休止した結果か** を見るためのもの (D97 Revisit (4) / D105)。復帰の速さそのものは別メトリクス ``tab_resume_ms`` が対象であり、この表では扱わない。"
              $lines += ""
              $lines += "⚠️ ``tabs_N`` と ``tabs_hold_N`` は**測定条件が違う** (前者は回収が終わる前に測る。D97)。同じ表に並んでも、**系統をまたいで比較してはならない。**"
              $lines += ""
              $lines += "| シナリオ | A (既定) MiB | B (compare_env) MiB | 差 (MiB) | 比 (B/A) | A プロセス数 | B プロセス数 | A 休止タブ数 | B 休止タブ数 |"
              $lines += "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
              foreach ($sc in $tabScenariosOnPage) {
                $baselineFiles = @($abFiles | Where-Object { $_.Name -like "$sc-windows-baseline-*" })
                $compareFiles = @($abFiles | Where-Object { $_.Name -like "$sc-windows-compare-*" })
                $a = @(Get-Medians $baselineFiles "rss_total_bytes")
                $b = @(Get-Medians $compareFiles "rss_total_bytes")
                if ($a.Count -eq 0 -or $b.Count -eq 0) { continue }
                $aMiB = ($a | Measure-Object -Average).Average / 1MB
                $bMiB = ($b | Measure-Object -Average).Average / 1MB
                $ratio = if ($aMiB -ne 0) { [math]::Round($bMiB / $aMiB, 3) } else { "n/a" }
                # プロセス数・休止タブ数はどちらも欠損しうる (古い結果ファイル)
                # ので、その場合は表に "-" を置いて RSS の行そのものは落とさない。
                $aProc = @(Get-Medians $baselineFiles "rss_process_count")
                $bProc = @(Get-Medians $compareFiles "rss_process_count")
                $aProcText = if ($aProc.Count -gt 0) {
                  [math]::Round(($aProc | Measure-Object -Average).Average, 1)
                } else { "-" }
                $bProcText = if ($bProc.Count -gt 0) {
                  [math]::Round(($bProc | Measure-Object -Average).Average, 1)
                } else { "-" }
                $aSuspended = @(Get-Medians $baselineFiles "suspended_tab_count")
                $bSuspended = @(Get-Medians $compareFiles "suspended_tab_count")
                $aSuspendedText = if ($aSuspended.Count -gt 0) {
                  [math]::Round(($aSuspended | Measure-Object -Average).Average, 0)
                } else { "-" }
                $bSuspendedText = if ($bSuspended.Count -gt 0) {
                  [math]::Round(($bSuspended | Measure-Object -Average).Average, 0)
                } else { "-" }
                $lines += "| $((Split-GroupName $sc).scenario) | $([math]::Round($aMiB, 1)) | $([math]::Round($bMiB, 1)) | $([math]::Round($bMiB - $aMiB, 1)) | $ratio | $aProcText | $bProcText | $aSuspendedText | $bSuspendedText |"
              }
              $lines += ""
            }
          }

          $summary = $lines -join "`n"
          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # `scenarios` と `pages` はどちらも「1 run に複数の計測を収める」
          # 入力なので、**どちらが指定されていても `multi` にする**
          # (Issue #231 のレビュー指摘)。`pages` だけを指定した run が
          # `velox-perf-windows-cold_startup` という名前で残ると、
          # artifact 名から複数ページ run だと読み取れない。
          name: velox-perf-windows-${{ (inputs.scenarios != '' || inputs.pages != '') && 'multi' || (inputs.scenario || 'cold_startup') }}
          path: |
            results/
            diag/
          retention-days: 30
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # Issue #211 項目4 の後半 / docs/decisions.md D106 Revisit condition (1)。
  #
  # D106 は schedule を足すところまでを行い、**結果を `results/history/` へ
  # 取り込む導線は意図的に未着手のまま残した** — 「誰が commit を作るか」
  # (作者・タイミング・競合・fork/権限) が独立した運用設計を要するため。
  # ここがその設計である。
  #
  # ## なぜ PR を作るのか (main へ直接 push しないのか)
  #
  # `main` には active な ruleset があり `pull_request` ルールを含む。bypass
  # は admin ロールのみで `GITHUB_TOKEN` は該当しないため、**workflow から
  # `main` へ直接 push する選択肢は最初から無い。** 承認は 0 件でよい設定
  # なので、PR を作れば既存の auto-merge がそのまま処理できる。
  #
  # ## なぜ PAT で PR を作るのか
  #
  # **`GITHUB_TOKEN` で作った PR は `on: pull_request` を発火させない**
  # (GitHub のループ防止仕様)。CI が 1 件も走らず、auto-merge の起動契機で
  # ある `workflow_run` も来ないため、**PR が誰にも気付かれないまま放置
  # される。** D91 が `@claude` メンションで実測した「GITHUB_TOKEN だと後続
  # の自動処理が動かない」と同じ罠なので、同じ対処 (`AUTO_MERGE_TOKEN`) を
  # 採る。未設定でも PR は作るが、`::warning::` を出して手動対応に落とす。
  #
  # ## なぜ Linux で走らせるのか
  #
  # 計測は Windows でしかできないが、**git と PR 作成は OS に依存しない。**
  # Windows ランナーは課金単価が高いので、artifact を挟んで Linux 側で行う。
  #
  # ## なぜ fork/PR から絶対に起動しないのか
  #
  # `perf-windows.yml` は「この workflow 自身を変更する PR」でも走る (D88)。
  # fork からの PR では `GITHUB_TOKEN` が読み取り専用なので push は失敗する
  # が、**より悪いのは起動してしまうこと自体**である — 外部から出された PR
  # の内容で、書き込み権限を持つジョブを動かすことになる。`schedule` と
  # 「main 上の `workflow_dispatch`」以外では起動しない。
  ingest-history:
    name: Record results into results/history
    needs: perf-windows
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'noan98/VeloX'
      && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    # 書き込み権限は**このジョブにだけ**与える。workflow 全体に付けると、
    # `pull_request` でも走る計測ジョブにまで書き込み権限が広がる。
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    env:
      HISTORY_BRANCH: perf/windows-history
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # 取り込み先ブランチを fetch し直すため全履歴が要る
          # (shallow だと `origin/main` とのマージができない)。
          fetch-depth: 0
          # **push も PAT で行う。** `GITHUB_TOKEN` による push は
          # `pull_request` の `synchronize` を発火させないため、既存の取り込み
          # PR を更新したときに **CI が再実行されないまま auto-merge の判定に
          # 入る。** 作成だけ PAT にしても、2 回目以降で同じ罠を踏む。
          token: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}

      # ⚠️ `upload-artifact` と **major を揃える** (混在は動作保証外)。
      # `test_perf_windows_inputs.py` が 2 つのバージョンを突き合わせる。
      #
      # 展開先を作業ツリーの外に置くのは意図的である。**リポジトリ内に置くと
      # `git status` に未追跡ファイルとして現れ、「範囲外の差分」の検査を
      # 自分で汚す。**
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.perf-windows.outputs.artifact_name }}
          path: ${{ runner.temp }}/bench-artifact

      - name: Prepare the history branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 既に open な取り込み PR があれば、その上に積む。**新しい PR を
          # 作り直すと、まだマージされていない前回分のデータが失われる。**
          open_pr=$(gh pr list --head "$HISTORY_BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "open な取り込み PR #${open_pr} があるので、その続きとして積みます"
            git fetch origin "$HISTORY_BRANCH"
            git checkout -B "$HISTORY_BRANCH" "origin/$HISTORY_BRANCH"
            # `results/history/` には追記しか起きないので main 側と競合する
            # ことは実質ない。競合したらジョブを落として気付く。
            git merge --no-edit origin/main
          else
            # open な PR が無いのにブランチだけ残っている場合、**取り込み分が
            # main に入っているとは限らない** (PR がマージされずに閉じられた
            # 等)。その状態で main から作り直すと push が non-fast-forward で
            # 弾かれ、原因の分かりにくいエラーになる。先に見て説明する。
            if git fetch origin "$HISTORY_BRANCH" 2>/dev/null; then
              if ! git merge-base --is-ancestor FETCH_HEAD origin/main; then
                echo "::error::ブランチ ${HISTORY_BRANCH} に main へ入っていない commit が残っています (PR がマージされずに閉じられた可能性)。内容を確認し、不要ならブランチを削除してから再実行してください。"
                exit 1
              fi
            fi
            git checkout -B "$HISTORY_BRANCH" origin/main
          fi
          echo "open_pr=${open_pr}" >> "$GITHUB_OUTPUT"

      # 入力はシェルへ直接展開せず環境変数で渡す (script injection 対策)。
      - name: Append results to results/history
        id: append
        env:
          COMPARE_ENV: ${{ needs.perf-windows.outputs.compare_env }}
          COMMON_ENV: ${{ needs.perf-windows.outputs.common_env }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/perf_history_plan.py \
            --results-dir "$RUNNER_TEMP/bench-artifact/results" \
            --history-dir results/history \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL" \
            --compare-env "$COMPARE_ENV" \
            --common-env "$COMMON_ENV"

      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
          OPEN_PR: ${{ steps.branch.outputs.open_pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # ⚠️ `git diff` は**未追跡ファイルを見ない。** 履歴ファイルは
          # 初回だけ新規作成なので、`git diff --quiet` で判定すると
          # **1 回目の取り込みが「変更なし」として静かに捨てられる。**
          #
          # ⚠️ さらに `--untracked-files=all` が要る。既定の
          # `git status --porcelain` は**未追跡ディレクトリを 1 行に畳む**
          # ので、初回は個々のファイルではなく `?? results/` とだけ出る。
          # それを範囲外判定に掛けると、**初回の取り込みが必ず「範囲外の
          # 差分あり」として落ちる。**
          changed=$(git status --porcelain --untracked-files=all)
          if [ -z "$changed" ]; then
            echo "履歴に変更がありません (取り込み済みの run だった可能性)。何もしません。"
            exit 0
          fi

          # **このジョブが触ってよいのは results/history/ の下だけである。**
          # 書き込み権限を持つ自動ジョブなので、範囲外の差分が出た時点で
          # 何が起きているか分からない — マージさせずにここで落とす。
          #
          # `cut -c4-` は porcelain の状態欄 (3 文字) を落とす。
          #
          # ⚠️ rename は `old -> new` の形で 1 行に**両方**残る。行全体を
          # 1 つのパスとして検査すると、**`results/history/x -> 範囲外/y`
          # が「results/history/ で始まる」ために素通りする** — 範囲外へ
          # 持ち出す向きの rename だけが検知から漏れる、という最悪の抜け方に
          # なる。`awk -F' -> '` で両側に割ってから検査する (rename でない行は
          # NF=1 なのでそのまま 1 パスとして出る)。
          outside=$(echo "$changed" | cut -c4- | awk -F' -> ' '{ for (i = 1; i <= NF; i++) print $i }' | grep -v '^results/history/' || true)
          if [ -n "$outside" ]; then
            echo "::error::results/history/ の外に差分があります。取り込みを中止します:"
            echo "$outside"
            exit 1
          fi

          git add results/history
          # ⚠️ コミットメッセージにクロージングキーワードと番号を隣接させない
          # (CLAUDE.md / D128 / D131)。GitHub 本体はコミットメッセージも解析
          # し、そこでは Markdown のコードスパンが効かない。
          git commit -m "perf(windows): 週次計測の結果を results/history に取り込む" \
            -m "Issue #211 項目4 の後半 / D106 Revisit condition (1)。自動生成。" \
            -m "$RUN_URL"
          git push -u origin "$HISTORY_BRANCH"

          if [ -n "$OPEN_PR" ]; then
            echo "既存の PR #${OPEN_PR} を更新しました"
            exit 0
          fi

          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::AUTO_MERGE_TOKEN が未設定です。GITHUB_TOKEN で作った PR は on: pull_request を発火させないため、CI も auto-merge も動きません (D91 と同じ罠)。この PR は手動で確認・マージしてください。"
          fi

          gh pr create \
            --base main \
            --head "$HISTORY_BRANCH" \
            --title "perf(windows): 週次計測の結果を results/history に取り込む" \
            --label automerge-without-codex \
            --body-file .github/pr-body-perf-history.md
