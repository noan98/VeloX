name: Performance (Windows)

# Issue #136。VeloX の性能実測はこれまで全て Linux (WebKitGTK/Xvfb、
# perf-gate.yml/docs/performance-targets.md) のものしかなく、CLAUDE.md
# 「対応 OS の優先度」が最優先と定める Windows (WebView2) の数値が
# 1 つも無かった。この workflow はそれを埋めるための **手動実行 + 週次
# スケジュール実行** ジョブ (後者は Issue #211 項目4 で追加。導入時点では
# 手動実行専用だった — 経緯は下記参照)。
#
# Issue #208 (docs/performance-targets.md §26) で役割が 1 つ増えた:
# 入力 `compare_env` に `KEY=VALUE` を渡すと、**同一ジョブ・同一ビルド・
# 同一ランナーの中で「既定 (A)」と「その環境変数を設定した状態 (B)」を
# 交互に計測する**。run をまたぐ比較では分離できないランナー個体差や
# ランナーイメージの更新を相殺できるので、性能回帰の原因切り分けに使う。
# 空欄にすれば従来どおりの単独計測に戻る。
#
# **手動実行 (workflow_dispatch) と週次スケジュール実行 (schedule) のみ。
# PR ごとの自動実行や性能回帰ゲートではない** (Issue #136 のスコープ外。
# 回帰ゲートは Linux の perf-gate.yml が引き続き担う。ゲート化しない理由は
# 下記「Issue #211 項目4」の節を参照):
#   - 性能回帰ゲートは Linux 側 (perf-gate.yml) で担保済みであり、
#     二重化する必要が無い。
#   - GUI アプリを CI 上で起動する構成は不安定になりやすく、PR を無用に
#     ブロックしたくない。
#   - Windows ランナーは Linux ランナーより実行コストが高い。
#
# ⚠️ **最大のリスク: windows-latest ランナー上で VeloX (WebView2 の
# ウィンドウ) が起動できるかどうかは、この workflow を実際に走らせるまで
# 分からない。** Linux は Xvfb で仮想ディスプレイを用意しているが、
# Windows ランナーには同種の仕組みが無い。ci.yml の Windows ジョブが
# D61 の判断で統合テスト (実ウィンドウを開くテスト) を意図的に除外して
# いるのも同じ未検証点による — この workflow の「VeloX を起動する」
# ステップが、そのものずばりの実地検証になる。起動できなかった場合は
# 無理に通そうとせず、Job Summary / 診断ステップのログに何が起きたかを
# 残し、セルフホストランナー等の方式再検討を次の課題とする
# (docs/decisions.md D88、Issue #59 が起動時間の調査で採った進め方と同じ)。
#
# ## Issue #211 項目4: なぜ `schedule` を足すか / なぜまだゲート化しないか
#
# D96 (Issue #208) が明らかにしたのは「`windows-latest` は run ごとに機種
# の異なるマシンを割り当てる」ことだった (AMD EPYC 9V74 / Intel Xeon
# 8573C / Intel Xeon 6973P-C / AMD EPYC 7763 の 4 機種が観測済み、
# `startup_window_created_ms` は 573〜922ms まで散らばる)。**手動実行
# だけでは、いつ・どの機種のデータが何本貯まるかを制御できず、機種ごとの
# 傾向を見るには本数が全く足りない。** そこで `schedule` を足し、既定条件
# (cold_startup、A/B 比較) で機械的に run を積み重ねる。機種ごとに系列を
# 分けて蓄積できるのは、Issue #211 項目2 (`docs/decisions.md` D106、
# `scripts/dashboard/common.py` の `machine_key`) が「同一 session_id でも
# 機種が違えば比較しない」を保証しているおかげであり、schedule 自体は
# `record.py`/`results/history/` への取り込みまでは行わない (§の末尾、
# 「Upload results」ステップの直前を参照 — artifact として残すのみで、
# history への commit 導線は今回のスコープでは未着手のまま)。
#
# **ここではまだ fail させない (ゲート化しない)。** 理由:
#   - Issue #211 項目3 (同一機種内での分散の実測) が未着手で、「どこからが
#     有意な差か」の閾値をまだ決められない。実測もせず勘で閾値を決めると、
#     D46/D96 が繰り返し指摘してきた「ノイズを回帰の証拠であるかのように
#     見せる」誤りを、今度は Windows の機種間・機種内ノイズに対してやる
#     ことになる。
#   - 機種ごとの系列 (machine_key) がある程度の本数貯まって初めて、
#     「同一機種内で許容できるばらつき」を実測できる。それより前に閾値を
#     決めるのは、D46 が実測データより先に何かを決め打ちすることを繰り返し
#     戒めてきたのと同じ誤りになる。
#   - したがってこの PR (Issue #211) では「貯める」ことだけを目的にし、
#     ゲート化は項目3 の実測が揃ってから改めて判断する。
#
# **頻度は週次にした。** 理由:
#   - Windows ランナーは (上記の通り) Linux ランナーより実行コストが高い。
#     日次では月に約 30 回の高コスト run を積み増すことになり、まだ
#     ゲート化もしない蓄積目的のデータにその頻度は見合わない。
#   - 一方で月次では、機種のサンプルが十分な本数に育つまで数ヶ月〜半年を
#     要し、項目3 (分散の実測) の着手が不必要に遅れる。
#   - `windows-latest` の機種はランナー割り当てのたびに変わりうる (D96)
#     ため、頻度を上げて「同一機種の run 数」を意図的に稼ぐことはできない
#     — 週次でも機種は毎回変わりうる。**この不確実性はコストを上げても
#     解消しないので、コストの低い側 (週次) を選ぶ。**
#   - cron は UTC で評価される。UTC 月曜 03:00 (JST 月曜正午ごろ) とし、
#     平日日中の CI 混雑時間帯を避けた。
#
# `on:` は workflow_dispatch が基本だが、release-windows.yml と同じ
# パターンで、この workflow 自身を変更する PR に限り pull_request でも
# 走らせる — workflow_dispatch は main にマージされるまで Actions タブに
# 現れないため、workflow 自身の変更を検証する唯一の手段になる。`schedule`
# は既定ブランチ (main) の workflow 定義でのみ評価され、fork や他ブランチ
# の同名ファイルからは起動しない (GitHub の仕様) — CLAUDE.md「public
# リポジトリであることは workflow を書くときの前提条件」の対象は
# `issue_comment`/`pull_request_review` のような「任意の GitHub ユーザが
# 発火できる」トリガであり、`schedule` はそれに該当しない (発火元はリポジ
# トリ設定であり、外部ユーザは発火できない)。書き込み権限やシークレットを
# 使うステップも無いため、投稿者を絞る `if` の追加は不要と判断した。
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "velox-bench list-scenarios の一覧から選ぶシナリオ ID"
        type: choice
        default: cold_startup
        options:
          - cold_startup
          - warm_startup
          - first_page_load
          - navigation
          - tab_create
          - tab_switch
          - tab_resume
          - background_cpu
          - tab_create_1
          - tab_create_5
          - tab_create_10
          - tab_create_20
          - tab_create_50
          - tab_switch_1
          - tab_switch_5
          - tab_switch_10
          - tab_switch_20
          - tab_switch_50
          - tabs_1
          - tabs_5
          - tabs_10
          - tabs_20
          - tabs_50
          # Issue #197 / §27.5。tabs_N と違い、タブを間隔を空けて開き、
          # 既定のメモリチェック周期でも休止が起き切るまで待ってから
          # mark を打つ (集計は mark 以降のみ)。**環境変数で周期を
          # 縮めなくても、既定設定のままのメモリ予算の効きが測れる。**
          - tabs_hold_1
          - tabs_hold_5
          - tabs_hold_10
          - tabs_hold_20
          - tabs_hold_50
      scenarios:
        description: "複数シナリオを 1 回の run で続けて計測する (カンマ区切り、例: tabs_1,tabs_5,tabs_10,tabs_20)。指定するとシナリオ選択より優先される。D96 の「Windows は run ごとに分ける」に従い、タブ数スケーリングのような複数点の比較はこれで同一 run に収める"
        type: string
        default: ""
      trials:
        description: "試行回数 (velox-bench run --trials)"
        type: string
        default: "10"
      compare_env:
        description: "A/B 比較の B 条件で追加する環境変数 (KEY=VALUE、複数はセミコロン区切り)。空欄なら比較せず A 条件だけを 1 回計測する"
        type: string
        default: "VELOX_MEMORY_BUDGET_MB=0"
      common_env:
        description: "A/B の両方に共通で設定する環境変数 (KEY=VALUE、セミコロン区切り)。測定条件を成立させるための設定に使う (例: tabs_N でメモリ予算を評価するときの VELOX_MEMORY_CHECK_INTERVAL_MS=500)"
        type: string
        default: ""
      repeats:
        description: "A/B のペアを何回繰り返すか (compare_env が空のときは無視される)"
        type: string
        default: "2"
      url:
        description: "計測対象ページの URL。空欄なら scripts/bench/pages/minimal.html を loopback 配信して使う"
        type: string
        default: ""
  # この workflow 自身を変更する PR でのみ実行して検証する (docs/
  # decisions.md D88、release-windows.yml と同じパターン)。それ以外の PR
  # では走らない。workflow_dispatch の入力は使えないため、既定値
  # (cold_startup / 10 回 / 固定ページ) で実行する。
  pull_request:
    paths:
      - ".github/workflows/perf-windows.yml"
  # Issue #211 項目4 / docs/decisions.md D106。機種ごとの系列を貯めるための
  # 定期計測 — 頻度・ゲート化を見送る理由は冒頭のコメント参照。cron は
  # UTC で評価される (UTC 月曜 03:00)。`schedule` は既定ブランチ (main) の
  # workflow 定義だけで評価され、他ブランチ/fork のこのファイルからは
  # 発火しない (GitHub の仕様)。
  schedule:
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always

# 手動実行はいつでも重ねて起動できてよい (前回の結果を待たずに再実行したい
# 場面がある) ので、Linux の perf-gate.yml のような直列化は行わない。
# ブランチ + workflow_dispatch の入力が同じ場合のみ、素朴に前の実行を
# 置き換える (cancel-in-progress = true) — Windows ランナーは高コストな
# ため、同一条件の実行を並べて無駄に消費しないようにする。schedule は常に
# `github.ref` = `refs/heads/main` で走るので、同じグループに乗る手動実行
# (main を対象にしたもの) と重なった場合は後勝ちで前者/後者が cancel
# されうる — 週次 1 回・手動実行は稀という運用なので実害は無いと判断した。
concurrency:
  group: perf-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-windows:
    name: velox-bench run (windows-latest)
    runs-on: windows-latest
    # workflow_dispatch では常に走る。schedule では毎週月曜 UTC 03:00 に
    # main に対して走る (Issue #211 項目4)。pull_request では上の paths
    # フィルタにより、この workflow 自身を変更する PR だけがここに来る。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # docs/performance-targets.md §1 は「測定環境を固定して記録する」
      # ことを求めている。GitHub-hosted ランナーは実行のたびにイメージが
      # 変わりうるため、毎回このステップで実際の値をログと Job Summary に
      # 残す (数値を決め打ちで文書に書かず、都度記録する)。
      - name: Record environment info (OS build / CPU / memory / WebView2 Runtime)
        id: env_info
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $mem = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)

          # WebView2 Runtime のバージョンはレジストリの pv 値から読む
          # (Evergreen ランタイムの標準的な確認方法)。見つからない場合は
          # 「不明」として記録する — このステップ自体は失敗させない
          # (実測の主目的である velox-bench run を先に進めるため)。
          $webview2Version = "(不明)"
          $regPaths = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          foreach ($p in $regPaths) {
            if (Test-Path $p) {
              $pv = (Get-ItemProperty -Path $p -Name "pv" -ErrorAction SilentlyContinue).pv
              if ($pv) { $webview2Version = $pv; break }
            }
          }

          # PowerShell の here-string (@"..."@) は閉じ側を行頭に置く必要が
          # あり、YAML のブロックスカラーが持ち込むインデントと相性が悪い
          # ため、行の配列 + join で組み立てる。
          $lines = @(
            "| 項目 | 値 |",
            "| --- | --- |",
            "| OS | $($os.Caption) |",
            "| OS ビルド番号 | $($os.BuildNumber) |",
            "| CPU | $($cpu.Name) ($($cpu.NumberOfLogicalProcessors) 論理コア) |",
            "| メモリ (物理, GiB) | $mem |",
            "| WebView2 Runtime | $webview2Version |",
            "| rustc | $(rustc --version) |"
          )
          $summary = $lines -join "`n"
          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          New-Item -ItemType Directory -Force -Path results | Out-Null
          $summary | Out-File -FilePath "results\environment-info.md" -Encoding utf8

          # Issue #208 (§26.4 事実 2)。`windows-latest` は run ごとに別
          # スペックのマシン (2 論理コア/8 GiB と 4 論理コア/16 GiB の両方が
          # 観測されている) が割り当てられるため、**どのランナーで測ったかを
          # 結果のすぐ隣に出す。** これが違う run どうしの絶対値は比較できない。
          "cpu=$($cpu.Name)" >> $env:GITHUB_OUTPUT
          "cores=$($cpu.NumberOfLogicalProcessors)" >> $env:GITHUB_OUTPUT
          "ram_gib=$mem" >> $env:GITHUB_OUTPUT

      - name: Build (release)
        run: cargo build --release

      # 入力 (または pull_request 実行時の既定値) から --url を決める。
      # 未指定/空なら scripts/bench/pages/ の固定ページを loopback 配信し、
      # ネットワーク非依存の再現可能な数値にする (perf-gate.yml / D46 と
      # 同じ方針)。
      - name: Determine benchmark URL
        id: bench_url
        shell: pwsh
        run: |
          $url = "${{ inputs.url }}"
          if ([string]::IsNullOrWhiteSpace($url)) {
            "url=http://127.0.0.1:8731/minimal.html" >> $env:GITHUB_OUTPUT
            "serve_fixed_pages=true" >> $env:GITHUB_OUTPUT
          } else {
            "url=$url" >> $env:GITHUB_OUTPUT
            "serve_fixed_pages=false" >> $env:GITHUB_OUTPUT
          }

      # ⚠️ ここは以前 `Start-Sleep -Seconds 2` の固定待ちだった。run
      # 34225449751 (本 PR の初回実行) で `python -m http.server` が 2 秒
      # では listen に間に合わず、"No connection could be made because the
      # target machine actively refused it." でジョブごと落ちた
      # (python プロセス自体は生きていた)。固定 wait は D84/D85 が統合
      # テストから追い出したのと同じ失敗の仕方をするので、**待つのではなく
      # 準備できたことを確かめる**形に変える。サーバの stdout/stderr も
      # 残しておき、起動そのものが失敗したときに理由が分かるようにする。
      - name: Serve fixed benchmark pages (default URL only)
        if: steps.bench_url.outputs.serve_fixed_pages == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # ⚠️ **stdout/stderr をリダイレクトしない。** 一度は診断用に
          # `-RedirectStandardOutput`/`-RedirectStandardError` を付けたが、
          # それを入れた 2 つの run (34225826524 / 34226965961) の
          # `page_load_ms` が 2077ms / 2085ms と、同じ固定ページの §21.2
          # (54.10ms) から 38 倍離れた。`http.server` はシングルスレッドで
          # リクエストごとに stderr へログを 1 行書くため、書き込み先が
          # ファイルになるとその I/O が応答をブロックしうる — これが原因か
          # どうかを確かめるため、まずリダイレクトを外した状態で測り直す
          # (§26.4 付随)。起動できなかったときの診断はプロセス一覧で足りる。
          Start-Process -FilePath python -ArgumentList "-m", "http.server", "8731" `
            -WorkingDirectory "scripts\bench\pages" -WindowStyle Hidden

          $deadline = (Get-Date).AddSeconds(30)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:8731/minimal.html" `
                -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop | Out-Null
              $ready = $true
              break
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $ready) {
            Write-Host "--- python プロセス ---"
            Get-Process python -ErrorAction SilentlyContinue |
              Format-Table Id, ProcessName, StartTime | Out-String | Write-Host
            Write-Host "--- 8731 を listen しているか ---"
            Get-NetTCPConnection -LocalPort 8731 -ErrorAction SilentlyContinue |
              Format-Table LocalAddress, LocalPort, State | Out-String | Write-Host
            throw "固定ページの配信サーバ (python -m http.server 8731) が 30 秒以内に応答しませんでした"
          }
          Write-Host "固定ページの配信を確認しました: http://127.0.0.1:8731/minimal.html"

      # 最大のリスク (GUI/WebView2 ウィンドウが起動できるか) の実地検証。
      # velox.exe を直接起動し、プロセス一覧と perf ログの有無を確認する —
      # Linux 側 perf-gate.yml の「Diagnose VeloX under Xvfb」ステップと
      # 同じ役割。**このステップ自体は失敗させない** (continue-on-error):
      # 起動できなくても、その事実と観測結果をログに残すことが目的であり、
      # 次の本実行ステップがどのみち同じ理由で失敗するため、ここで二重に
      # ジョブを失敗させる必要はない。
      - name: Diagnose VeloX launch on windows-latest (never fails the job)
        id: diag
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          $out = "diag\perf.jsonl"

          $env:VELOX_PERF_METRICS = "1"
          $env:VELOX_PERF_FORMAT = "json"
          $env:VELOX_PERF_OUTPUT = $out
          $env:VELOX_DATA_DIR = "diag\data"

          $proc = Start-Process -FilePath "target\release\velox.exe" `
            -ArgumentList "--homepage", "${{ steps.bench_url.outputs.url }}" `
            -PassThru
          Start-Sleep -Seconds 8

          Write-Host "--- process snapshot ---"
          Get-Process | Where-Object {
            $_.ProcessName -match "velox|msedgewebview2"
          } | Format-Table Id, ProcessName, MainWindowTitle | Out-String | Write-Host

          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "velox.exe が診断中に自発的に終了していた (ExitCode=$($proc.ExitCode))"
          }

          Write-Host "--- perf log ---"
          if (Test-Path $out) {
            $lines = Get-Content $out
            Write-Host "records: $($lines.Count)"
            $lines | Select-Object -First 5 | Write-Host
          } else {
            Write-Host "NO perf records (perf ログファイルが作られていない = ウィンドウ作成の途中でブロックされている可能性)"
          }

      # Issue #208。`windows-latest` の `cold_startup` は
      # `startup_window_created_ms` の中央値が 644.05ms (09-07) →
      # 885.65ms (09-08) と +38% 伸びており (docs/performance-targets.md
      # §24.5)、最有力の仮説は #185 (D90: メモリ予算 700 MiB による自動タブ
      # 休止の既定 ON) である。**その検定を、Issue #208 が最初に挙げた
      # 「候補コミットへブランチを立てて workflow_dispatch を回す二分探索」
      # ではなく、同じ head・同じジョブの中の A/B 交互実行で行う。**
      #
      # なぜ A/B の方が強いか:
      #   - 二分探索は run をまたぐ比較なので、ランナー個体差・イメージ更新・
      #     WebView2 Runtime の更新といった「別 run では揃わない変数」が
      #     そのまま交絡する。§24.5 が run 1 だけ 27% 低い理由を確定できて
      #     いないのは、まさにこれが分離できていないため。
      #   - A/B は同一ジョブ・同一ビルド・同一ランナーなので、それらが丸ごと
      #     相殺される。差が出れば「その環境変数が起動時間を変えた」以外の
      #     説明が残らない。
      #   - 候補コミットへの実験用ブランチを作らずに済む。
      #
      # 既定の B 条件 `VELOX_MEMORY_BUDGET_MB=0` は #185 が既定 ON にした
      # メモリ予算シグナルだけを切る (`config::resolve_suspension` の
      # `overridable`: 明示的な `0` は既定が `Some` でも必ず `None` になる。
      # これが D90 の逃げ道として用意された値そのもの)。`settings.json` は
      # 起動時に自動生成されないため (`app::run` の `None => to_settings()`
      # は in-memory のみ)、CI のクリーンなランナーでは環境変数が
      # `apply_settings` に上書きされる心配もない。
      #
      # A → B → A → B と交互に回すのは順序効果 (ディスクキャッシュの温まり、
      # データディレクトリに溜まる履歴/セッション) を検出するため。**A 同士
      # のばらつきが A/B 差と同程度なら、その差は結論にしてはならない。**
      #
      # ⚠️ velox-bench は子プロセス (velox.exe) の環境をクリアしないので、
      # ここで設定した環境変数はそのまま計測対象に効く。裏を返すと B 条件の
      # 変数を解除し忘れると以降の A 条件が汚染されるため、必ず finally で
      # 解除する。
      - name: Run velox-bench (windows-latest, A/B)
        id: bench_run
        shell: pwsh
        # 入力はシェルへ直接展開せず環境変数で渡す (script injection 対策)。
        env:
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
          INPUT_TRIALS: ${{ inputs.trials }}
          INPUT_COMPARE_ENV: ${{ inputs.compare_env }}
          INPUT_COMMON_ENV: ${{ inputs.common_env }}
          INPUT_REPEATS: ${{ inputs.repeats }}
          EVENT_NAME: ${{ github.event_name }}
          BENCH_URL: ${{ steps.bench_url.outputs.url }}
        run: |
          $ErrorActionPreference = "Stop"
          $scenario = $env:INPUT_SCENARIO
          if ([string]::IsNullOrWhiteSpace($scenario)) { $scenario = "cold_startup" }

          # Issue #197 / D93 子 Issue 案 A。タブ数スケーリングのように
          # **複数の点を突き合わせたい計測は、同じ run の中で採らなければ
          # ならない** (D96 決定 3: run ごとにランナーの機種が変わり、絶対値は
          # 23% 動く)。`scenarios` はそのための入力で、指定されたシナリオを
          # 1 つのジョブで順に計測する。各シナリオはそれぞれ A/B ペアを持つ。
          $scenariosRaw = $env:INPUT_SCENARIOS
          if (-not [string]::IsNullOrWhiteSpace($scenariosRaw)) {
            $scenarioList = @($scenariosRaw -split ',' |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($scenarioList.Count -eq 0) {
              throw "scenarios の書式が不正です: '$scenariosRaw' (カンマ区切りのシナリオ ID を指定してください)"
            }
          } else {
            $scenarioList = @($scenario)
          }
          Write-Host "計測するシナリオ: $($scenarioList -join ', ')"
          $trials = $env:INPUT_TRIALS
          if ([string]::IsNullOrWhiteSpace($trials)) { $trials = "10" }

          # pull_request / schedule 実行では workflow_dispatch の入力が
          # 届かない (すべて空文字列 — GitHub の仕様) ので既定値をここで
          # 補う。`compare_env` は「空欄 = 比較しない」という意味を持つ
          # 入力なので、空欄を既定値で埋めてよいのは、入力そのものが存在
          # しない pull_request / schedule のときだけである。**schedule を
          # ここに足し忘れると、ジョブ自体は失敗しないが `compare_env` が
          # 空欄のまま単独計測 (A のみ) に落ち、Issue #211 項目4 が意図する
          # 「機種ごとの A/B 系列を貯める」定期計測になっていないことに
          # 誰も気付けない** — CI が緑のまま目的を達成しない、という壊れ方
          # なので、pull_request と同じ既定値をここで明示的に補う。
          $compareEnv = $env:INPUT_COMPARE_ENV
          $commonEnv = $env:INPUT_COMMON_ENV
          $repeatsRaw = $env:INPUT_REPEATS
          if ($env:EVENT_NAME -eq "pull_request" -or $env:EVENT_NAME -eq "schedule") {
            $compareEnv = "VELOX_MEMORY_BUDGET_MB=0"
            $commonEnv = ""
            $repeatsRaw = "2"
          }
          if ([string]::IsNullOrWhiteSpace($repeatsRaw)) { $repeatsRaw = "2" }
          $repeats = 0
          if (-not [int]::TryParse($repeatsRaw, [ref]$repeats) -or $repeats -lt 1) {
            throw "repeats は 1 以上の整数で指定してください (受け取った値: '$repeatsRaw')"
          }

          # "KEY=VALUE;KEY2=VALUE2" を実際の環境変数として設定し、設定した
          # 名前の一覧を返す (解除に使う)。
          function Set-EnvFromSpec([string] $spec) {
            $names = @()
            foreach ($pair in $spec -split ';') {
              $entry = $pair.Trim()
              if ([string]::IsNullOrWhiteSpace($entry)) { continue }
              $index = $entry.IndexOf('=')
              if ($index -lt 1) {
                throw "compare_env の書式が不正です: '$entry' (KEY=VALUE をセミコロンで区切ってください)"
              }
              $name = $entry.Substring(0, $index).Trim()
              $value = $entry.Substring($index + 1).Trim()
              Set-Item -Path "Env:$name" -Value $value
              $names += $name
            }
            if ($names.Count -eq 0) {
              throw "compare_env に有効な KEY=VALUE がありません: '$spec'"
            }
            return $names
          }

          function Invoke-Bench([string] $sc, [string] $outfile, [string] $label) {
            Write-Host "=== $label -> $outfile ==="
            & target\release\velox-bench.exe run `
              --scenario $sc `
              --trials $trials `
              --url "$env:BENCH_URL" `
              --output $outfile
            if ($LASTEXITCODE -ne 0) {
              throw "velox-bench run が失敗しました (条件: $label, exit code $LASTEXITCODE) — 上の診断ステップのログを確認してください"
            }
          }

          # A/B の両方に共通で効かせる設定 (Issue #197)。**測定条件そのものを
          # 成立させるためのもの**で、A と B の差には現れない。例:
          # `tabs_N` のスクリプトは 9 タブを連続で開いて 3 秒待って quit する
          # ため、プロセスの生存は約 6 秒しかない。休止判定に使うメモリ
          # サンプラは `sleep(interval)` を**先に**実行する既定 5 秒周期
          # なので、そのままではサンプルが 0〜1 回しか取れず、**メモリ予算は
          # 原理的に発動しない** (run 34227483724 の tabs_10 A/B が差 -0.4%
          # に終わった理由がこれ)。`VELOX_MEMORY_CHECK_INTERVAL_MS=500` の
          # ように周期を詰めて初めて、予算の有無が結果に出る。
          if (-not [string]::IsNullOrWhiteSpace($commonEnv)) {
            Write-Host "A/B 共通の環境変数: $commonEnv"
            Set-EnvFromSpec $commonEnv | Out-Null
          }

          # A/B 比較表を作る後段のステップは別プロセスなので、ここで解決した
          # 値 (pull_request 実行時の既定を含む) をステップ出力で渡す。
          "compare_env<<VELOX_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $compareEnv | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VELOX_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          foreach ($sc in $scenarioList) {
            if ([string]::IsNullOrWhiteSpace($compareEnv)) {
              # 従来どおりの単独計測。ファイル名も従来のまま
              # (§21/§24 の結果と同じ名前で artifact に並ぶ)。
              Invoke-Bench $sc "results\$sc-windows.json" "[$sc] A (既定)"
            } else {
              Write-Host "[$sc] A/B 比較: B 条件 = '$compareEnv' / ペア数 = $repeats"
              for ($r = 1; $r -le $repeats; $r++) {
                Invoke-Bench $sc "results\$sc-windows-baseline-$r.json" "[$sc] A (既定) #$r"
                $names = Set-EnvFromSpec $compareEnv
                try {
                  Invoke-Bench $sc "results\$sc-windows-compare-$r.json" "[$sc] B ($compareEnv) #$r"
                } finally {
                  foreach ($name in $names) {
                    Remove-Item -Path "Env:$name" -ErrorAction SilentlyContinue
                  }
                }
              }
            }
          }

      - name: Show result summary
        if: always()
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path results -Filter "*-windows*.json" -ErrorAction SilentlyContinue |
            Sort-Object Name)
          if ($files.Count -eq 0) {
            Write-Host "結果ファイルが生成されていません (velox-bench run が失敗した可能性)"
            exit 0
          }
          foreach ($file in $files) {
            Write-Host "--- $($file.Name) ---"
            Get-Content $file.FullName | Write-Host
          }

      # Issue #182 (docs/decisions.md D92)。§21 の初回実測で
      # startup_first_load_ms 716.7ms のうち startup_window_created_ms が
      # 644.1ms を占めることが分かり、#182 でその区間を 4 つの中間チェック
      # ポイントに分解した。結果 JSON は全チェックポイントを「プロセス開始
      # からの累積 ms」で持つため、区間ごとの長さを見るには隣り合う値を
      # 引き算する必要がある。毎回それを手でやるのは面倒なだけでなく間違え
      # やすいので、ここで Job Summary に表として出す。
      #
      # ⚠️ **この差分は「区間の中央値」ではなく「累積中央値どうしの差」**。
      # 各メトリクスの中央値は別々の試行から来うるため、両者は一致しない。
      # どちらの区間が支配的かを一目で見るには十分だが、区間そのものの
      # 分布を論じるなら試行ごとに引き算した値を集計すること
      # (docs/performance-targets.md §24.2 に手順がある)。
      #
      # 後半の A/B 比較表が Issue #208 の本題。こちらは累積値どうしを
      # 条件間で比べるだけなので、上の注意は当てはまらない。
      #
      # 本実行 (velox-bench run) が失敗しても結果の取りこぼしを増やさない
      # よう、常に走り、単独では決してジョブを落とさない。
      - name: Startup breakdown / A-B summary (Issue #182, #208)
        if: always()
        continue-on-error: true
        shell: pwsh
        # bench_run が失敗していれば空になる (表の見出しが空欄になるだけで、
        # 内訳表そのものは出せる)。
        env:
          COMPARE_ENV: ${{ steps.bench_run.outputs.compare_env }}
          COMMON_ENV: ${{ inputs.common_env }}
          RUNNER_CPU: ${{ steps.env_info.outputs.cpu }}
          RUNNER_CORES: ${{ steps.env_info.outputs.cores }}
          RUNNER_RAM_GIB: ${{ steps.env_info.outputs.ram_gib }}
        run: |
          $ErrorActionPreference = "Continue"
          $files = @(Get-ChildItem -Path results -Filter "*-windows*.json" -ErrorAction SilentlyContinue |
            Sort-Object Name)
          if ($files.Count -eq 0) {
            Write-Host "結果ファイルが無いため起動内訳をスキップします"
            exit 0
          }
          # 到達順。process_start は 0ms の起点なので表の先頭に置く。
          $checkpoints = @(
            @{ key = "startup_event_loop_ms";             label = "event_loop (tao のイベントループ生成)" },
            @{ key = "startup_pre_window_setup_ms";       label = "pre_window_setup (VeloX 自身の Rust セットアップ)" },
            @{ key = "startup_native_window_ms";          label = "native_window (tao のネイティブウィンドウ生成)" },
            @{ key = "startup_toolbar_webview_ms";        label = "toolbar_webview (最初の webview = エンジン初期化)" },
            @{ key = "startup_window_created_ms";         label = "window_created (content webview まで完了)" },
            @{ key = "startup_toolbar_ready_ms";          label = "toolbar_ready" },
            @{ key = "startup_first_load_ms";             label = "first_load" }
          )
          $lines = @()
          foreach ($file in $files) {
            $result = Get-Content $file.FullName -Raw | ConvertFrom-Json
            $lines += "### 起動の内訳 — ``$($file.Name)`` (Issue #182)"
            $lines += ""
            $lines += "累積中央値と、隣接する累積中央値の差。**差は区間ごとの中央値ではない** (各中央値は別々の試行から来うる)。"
            $lines += ""
            $lines += "| チェックポイント | 累積 median (ms) | 直前との差 (ms) |"
            $lines += "| --- | ---: | ---: |"
            $previous = 0.0
            $missing = @()
            foreach ($cp in $checkpoints) {
              $stats = $result.metrics.($cp.key)
              if ($null -eq $stats) {
                $missing += $cp.key
                continue
              }
              $median = [double]$stats.median
              $lines += "| $($cp.label) | $([math]::Round($median, 2)) | $([math]::Round($median - $previous, 2)) |"
              $previous = $median
            }
            if ($missing.Count -gt 0) {
              $lines += ""
              $lines += "> 欠損: $($missing -join ', ') — このシナリオでは記録されないか、#182 より前のビルドの結果ファイルです。"
            }
            $lines += ""
          }

          # --- Issue #208 / #197: シナリオごとの A/B 比較 ----------------
          #
          # ⚠️ **シナリオごとにグループ化する。** `scenarios` 入力で複数
          # シナリオを 1 つの run で回せるようになったため (Issue #197 /
          # D93 子 Issue 案 A)、全ファイルをまとめて baseline/compare の
          # 2 群に分けると別シナリオの値が混ざってしまう。
          function Get-Medians([object[]] $fileList, [string] $key) {
            $values = @()
            foreach ($f in $fileList) {
              $parsed = Get-Content $f.FullName -Raw | ConvertFrom-Json
              $stats = $parsed.metrics.($key)
              if ($null -ne $stats) { $values += [double]$stats.median }
            }
            return $values
          }

          # ファイル名 "<scenario>-windows-(baseline|compare)-<n>.json" から
          # シナリオ名を取り出す。
          $abPattern = '^(.+)-windows-(baseline|compare)-\d+\.json$'
          $abFiles = @($files | Where-Object { $_.Name -match $abPattern })
          $scenarioNames = @($abFiles | ForEach-Object {
            if ($_.Name -match $abPattern) { $Matches[1] }
          } | Select-Object -Unique)

          # tabs_N / tabs_hold_N は数値順に並べる (スケーリングを読むため)。
          # それ以外は名前順。**`tabs_hold_` を勘定に入れ忘れると `tabs_hold_20`
          # が名前順に落ちるうえ、下のスケーリング表からも漏れる** (run
          # 34247895418 で実際に漏れた)。
          $scenarioNames = @($scenarioNames | Sort-Object {
            if ($_ -match '^tabs_(?:hold_)?(\d+)$') { [int]$Matches[1] } else { [int]::MaxValue }
          }, { $_ })

          $compareKeys = @(
            "startup_native_window_ms",
            "startup_toolbar_webview_ms",
            "startup_window_created_ms",
            "startup_toolbar_ready_ms",
            "startup_first_load_ms",
            "page_load_ms",
            "rss_total_bytes",
            # D97 Revisit condition (1)。**「休止で WebView2 のプロセスが
            # 実際に減っているか」**を見るための鍵。suspend_tab は
            # tab.webview.take() で webview を drop するだけなので、
            # プロセスまで消えるかどうかは OS とエンジン次第であり、
            # RSS の減少だけでは区別がつかない。
            #   - プロセス数が減っている   -> プロセス単位で回収できている
            #   - 減っていない             -> webview は落ちてもプロセスは残る
            # 後者なら #176 Memory Budget Manager の設計課題になる。
            "rss_process_count"
          )

          if ($scenarioNames.Count -gt 0) {
            $lines += "### A/B 比較 (Issue #208 / #197)"
            $lines += ""
            $lines += "A = 既定のまま / B = ``$env:COMPARE_ENV`` を設定して起動。同一ジョブ・同一ビルド・同一ランナーで交互に計測しているため、ランナー個体差やイメージ更新は相殺される。"
            $lines += ""
            if (-not [string]::IsNullOrWhiteSpace($env:COMMON_ENV)) {
              $lines += "A/B 共通で設定した環境変数: ``$env:COMMON_ENV`` (測定条件を成立させるためのもので、A と B の差には現れない)"
              $lines += ""
            }
            $lines += "計測したランナー: $env:RUNNER_CPU / $env:RUNNER_CORES 論理コア / RAM $env:RUNNER_RAM_GIB GiB。**``windows-latest`` は run ごとに別スペックのマシンが割り当てられる (§26.4 事実 2)。この行が違う run どうしの絶対値を比較してはならない。**"
            $lines += ""
            $lines += "**A 同士のばらつき (下表の「A の各 run」) が A/B 差と同程度なら、その差は結論にしてはならない。**"
            $lines += ""
          }

          foreach ($sc in $scenarioNames) {
            $baselineFiles = @($abFiles | Where-Object { $_.Name -like "$sc-windows-baseline-*" })
            $compareFiles = @($abFiles | Where-Object { $_.Name -like "$sc-windows-compare-*" })
            if ($baselineFiles.Count -eq 0 -or $compareFiles.Count -eq 0) { continue }
            $lines += "#### ``$sc``"
            $lines += ""
            $lines += "| メトリクス | A の各 run の median | A 平均 | B の各 run の median | B 平均 | 差 (B-A) | 比 (B/A) |"
            $lines += "| --- | --- | ---: | --- | ---: | ---: | ---: |"
            foreach ($key in $compareKeys) {
              # 単一要素や空を返したときに配列で扱えるよう @() で包む。
              $a = @(Get-Medians $baselineFiles $key)
              $b = @(Get-Medians $compareFiles $key)
              if ($a.Count -eq 0 -or $b.Count -eq 0) { continue }
              $aAvg = ($a | Measure-Object -Average).Average
              $bAvg = ($b | Measure-Object -Average).Average
              $digits = if ($key -eq "rss_total_bytes" -or $key -eq "rss_process_count") { 0 } else { 2 }
              $aList = ($a | ForEach-Object { [math]::Round($_, $digits) }) -join ", "
              $bList = ($b | ForEach-Object { [math]::Round($_, $digits) }) -join ", "
              $ratio = if ($aAvg -ne 0) { [math]::Round($bAvg / $aAvg, 3) } else { "n/a" }
              $lines += "| $key | $aList | $([math]::Round($aAvg, $digits)) | $bList | $([math]::Round($bAvg, $digits)) | $([math]::Round($bAvg - $aAvg, $digits)) | $ratio |"
            }
            $lines += ""
          }

          # --- タブ数スケーリング (Issue #197 / D93 子 Issue 案 A) --------
          #
          # 複数シナリオを 1 run で回したときだけ出す。**同一 run 内なので
          # ここに並ぶ値どうしは比較してよい** — それが `scenarios` 入力を
          # 足した理由そのものである (D96 決定 3)。
          # ⚠️ `tabs_hold_N` を含めること。`^tabs_\d+$` だけだと
          # `tabs_hold_20` がマッチせず、**スケーリング表が丸ごと出ない**
          # (run 34247895418 で実際にそうなった)。
          $tabScenarios = @($scenarioNames | Where-Object { $_ -match '^tabs_(?:hold_)?\d+$' })
          if ($tabScenarios.Count -gt 1) {
            $lines += "### タブ数スケーリング (Issue #197)"
            $lines += ""
            $lines += "``rss_total_bytes`` の平均を MiB で、``rss_process_count`` の平均をプロセス数で示す。**同一 run 内の比較なので、この表の行どうしは並べて読んでよい。**"
            $lines += ""
            $lines += "プロセス数の列は **休止で WebView2 のプロセスが実際に減っているか** を見るためのもの (D97 Revisit (1))。``suspend_tab`` は webview を drop するだけなので、プロセスまで消えるかは RSS だけでは区別がつかない。"
            $lines += ""
            $lines += "⚠️ ``tabs_N`` と ``tabs_hold_N`` は**測定条件が違う** (前者は回収が終わる前に測る。D97)。同じ表に並んでも、**系統をまたいで比較してはならない。**"
            $lines += ""
            $lines += "| シナリオ | A (既定) MiB | B (compare_env) MiB | 差 (MiB) | 比 (B/A) | A プロセス数 | B プロセス数 |"
            $lines += "| --- | ---: | ---: | ---: | ---: | ---: | ---: |"
            foreach ($sc in $tabScenarios) {
              $baselineFiles = @($abFiles | Where-Object { $_.Name -like "$sc-windows-baseline-*" })
              $compareFiles = @($abFiles | Where-Object { $_.Name -like "$sc-windows-compare-*" })
              $a = @(Get-Medians $baselineFiles "rss_total_bytes")
              $b = @(Get-Medians $compareFiles "rss_total_bytes")
              if ($a.Count -eq 0 -or $b.Count -eq 0) { continue }
              $aMiB = ($a | Measure-Object -Average).Average / 1MB
              $bMiB = ($b | Measure-Object -Average).Average / 1MB
              $ratio = if ($aMiB -ne 0) { [math]::Round($bMiB / $aMiB, 3) } else { "n/a" }
              # プロセス数は欠損しうる (古い結果ファイル) ので、その場合は
              # 表に "-" を置いて RSS の行そのものは落とさない。
              $aProc = @(Get-Medians $baselineFiles "rss_process_count")
              $bProc = @(Get-Medians $compareFiles "rss_process_count")
              $aProcText = if ($aProc.Count -gt 0) {
                [math]::Round(($aProc | Measure-Object -Average).Average, 1)
              } else { "-" }
              $bProcText = if ($bProc.Count -gt 0) {
                [math]::Round(($bProc | Measure-Object -Average).Average, 1)
              } else { "-" }
              $lines += "| $sc | $([math]::Round($aMiB, 1)) | $([math]::Round($bMiB, 1)) | $([math]::Round($bMiB - $aMiB, 1)) | $ratio | $aProcText | $bProcText |"
            }
            $lines += ""
          }

          $summary = $lines -join "`n"
          Write-Host $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velox-perf-windows-${{ inputs.scenarios != '' && 'multi' || (inputs.scenario || 'cold_startup') }}
          path: |
            results/
            diag/
          retention-days: 30
          if-no-files-found: warn
