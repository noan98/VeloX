name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, lint & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install WebKitGTK + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb dbus-x11

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Issue #34: `cargo test` also includes `tests/integration.rs`, which
      # launches the real `velox` binary. Those tests self-skip (a pass, not
      # a failure) when no display/D-Bus session bus is available, but this
      # job *does* have both via xvfb-run/dbus-run-session, so they run for
      # real here — the whole point is to catch the #72 regression shape
      # (all unit tests green, VeloX itself unresponsive) in this very job.
      # `dbus-run-session` is required, not optional: without a D-Bus
      # session bus, WebKitGTK's web process cannot start and `velox` hangs
      # silently instead of making progress — see docs/benchmarking.md's
      # 「実行環境要件」and docs/decisions.md D46/D47.
      # VELOX_INTEGRATION_REQUIRE_GUI turns the integration tests' "no
      # display/D-Bus, skip me" path into a hard failure. A skip is an
      # ordinary green pass, so without this a broken xvfb-run/dbus-run-session
      # setup here would silently drop every integration test and leave the
      # job green — the same green-but-untested shape #34 exists to prevent.
      - name: Test (unit + integration, under Xvfb/D-Bus)
        env:
          VELOX_INTEGRATION_REQUIRE_GUI: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            dbus-run-session -- cargo test

      - name: Build
        run: cargo build

  check-windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Windows (WebView2) はビルドに追加のシステム依存が無い
      # (release-windows.yml と同じ前提。CLAUDE.md「対応 OS の優先度」参照)。
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Build
        run: cargo build

      # `cargo test` (引数なし) は `tests/integration.rs` も含めて実行し、
      # 実際に `velox` バイナリを起動する。Linux 版の
      # skip_without_gui!() は DISPLAY/DBUS が無ければ自動でスキップするが、
      # macOS/Windows は「デスクトップ OS なら追加の下準備なしに GUI が
      # 起動できるはず」という前提で意図的に *スキップしない*
      # (tests/integration.rs の gui_skip_reason を参照)。
      #
      # つまり windows-latest のホストランナー上で実際にウィンドウを開く
      # ことになるが、GitHub Actions の Windows ランナーでそれが安定して
      # 成立するかは未検証・不確実 (docs/decisions.md D61)。ここで
      # ごまかして「素通りさせて緑にする」(#34 が防ごうとした形そのもの) の
      # を避けるため、Windows ジョブでは `--lib` に絞って単体テスト
      # (`src/browser/` 配下の純粋ロジック) だけを実行し、GUI を起動する
      # 統合テストは対象外にする。将来 Windows ランナーでの GUI 起動が
      # 検証できたら、このジョブにも統合テストを追加する (D61 の
      # Revisit condition)。
      - name: Test (unit only — see D61 for why integration tests are excluded here)
        run: cargo test --lib
