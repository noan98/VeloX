name: Release (Windows)

# Windows 向けリリースビルド。2 つの起動方法がある:
#
# 1. workflow_dispatch — GitHub の Actions タブから「Run workflow」を押す
#    (どのブランチでも可)。成果物は Actions の実行ページの Artifacts
#    (`velox-windows-x86_64`) からダウンロードする。
# 2. `v*` タグの push (例: `git tag v0.1.0 && git push origin v0.1.0`)。
#    上記に加えて GitHub Release を作成し、zip を添付する。
#
# Linux 用の CI (`ci.yml`) と違い、Windows は追加のシステム依存が無い
# (WebView2 は Windows 11 / 近年の Windows 10 に同梱)。ビルドは
# `Cargo.toml` の `[profile.release]` (thin LTO + strip) をそのまま使う。
#
# Linux 向けの同種の workflow は `release-linux.yml` (最小限のビルド済み
# tarball のみ、AppImage/deb 等のネイティブパッケージ化は対象外)。
# macOS は対象外 (Issue #41 / docs/decisions.md D70 参照 — CLAUDE.md の
# OS 優先度方針に従い、本格対応は品質担保後に着手する)。
#
# コード署名 (Issue #42 / docs/decisions.md D73): 下記 6 つの Secrets /
# Variables が揃っている場合のみ、Azure Trusted Signing (現行の製品名は
# Artifact Signing) で実行ファイルに Authenticode 署名を行う。
#   - secrets.WINDOWS_CODESIGN_AZURE_CLIENT_ID
#   - secrets.WINDOWS_CODESIGN_AZURE_TENANT_ID
#   - secrets.WINDOWS_CODESIGN_AZURE_SUBSCRIPTION_ID
#   - vars.WINDOWS_CODESIGN_ENDPOINT
#   - vars.WINDOWS_CODESIGN_ACCOUNT_NAME
#   - vars.WINDOWS_CODESIGN_CERT_PROFILE_NAME
# いずれか 1 つでも未設定なら署名ステップ一式をスキップし、これまでどおり
# 無署名の zip を作る (このリポジトリには証明書が無いため、現状は常に
# スキップされる)。証明書取得後の設定手順は docs/windows-code-signing.md
# を参照。
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
  # この workflow 自身を変更する PR では実際にビルドして検証する
  # (workflow_dispatch は main にマージされるまで Actions タブに現れない
  # ため、PR の段階では手動実行できない)。それ以外の PR では走らない。
  pull_request:
    paths:
      - ".github/workflows/release-windows.yml"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # タグ push 時に GitHub Release を作成するため
  id-token: write # Azure Trusted Signing への OIDC 認証用 (azure/login)。
  # 署名用 Secrets/Variables が未設定なら azure/login 自体が動かないため、
  # このトークンが実際に要求されることはない。

# 同じタグに対して release-windows.yml と release-linux.yml が同時に走ると、
# 両方が `softprops/action-gh-release` で同じ Release を作りに行って競合する
# (「無ければ作成・あれば更新」という動作のため、ほぼ同時だと両方が
# 「無い」と判断して作成しに行き、片方が失敗し得る)。
#
# そこで **タグ push のときだけ** release-linux.yml と同じ group 名を共有し、
# `cancel-in-progress: false` でキャンセルではなく直列化する。group にタグ名
# を含めるので、別タグのリリース同士は並列に走る。
#
# 一方 PR や workflow_dispatch では Release を作らないので直列化する理由が
# 無い (むしろ両 workflow の CI が不必要に待たされる)。この場合は workflow
# ごとに別の group 名にして、従来どおり並列に走らせる (docs/decisions.md D70)。
concurrency:
  group: >-
    ${{ startsWith(github.ref, 'refs/tags/v')
    && format('release-tag-{0}', github.ref)
    || format('release-windows-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build release (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # タグ push 時、`Cargo.toml` の version と一致しないタグで release を
      # 作ってしまうと、GitHub Release のタグ名と zip 内のファイル名/
      # `Cargo.toml` の version 表示がずれる (タグを打つ前に version を
      # 上げ忘れた場合に起こりうる)。ここで早期に失敗させ、
      # 「タグから再現可能なビルド」の一貫性を保証する。
      - name: Verify tag matches Cargo.toml version (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $cargoVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($tagVersion -ne $cargoVersion) {
            throw "tag v$tagVersion does not match Cargo.toml version $cargoVersion"
          }
          "tag v$tagVersion matches Cargo.toml version $cargoVersion"

      - name: Build (release)
        run: cargo build --release --locked

      # velox には `--help` のような「ウィンドウを開かずに終了する」引数が
      # 無いため、ここではビルド成果物の存在とサイズだけを確認する
      # (ヘッドレスなランナーで GUI を起動しても検証にならない)。
      - name: Verify build outputs
        shell: pwsh
        run: |
          foreach ($exe in "velox.exe", "velox-bench.exe") {
            $path = "target\release\$exe"
            if (-not (Test-Path $path)) { throw "missing: $path" }
            $size = (Get-Item $path).Length
            if ($size -lt 100KB) { throw "suspiciously small: $path ($size bytes)" }
            "$exe : $size bytes"
          }

      # 署名用の Secrets/Variables (下記 6 つ) が全て揃っている場合のみ、
      # このあとの Azure ログイン・署名ステップを実行する。1 つでも
      # 欠けていれば `enabled=false` にして無署名のままビルドを続ける
      # (このリポジトリには証明書が無いため、現状は常に false になる)。
      # `if:` で `secrets.*` を直接比較する書き方は job 単位の条件では
      # 使えず、step 単位でもツール/バージョンによって扱いが揺れるため
      # (実際に skip されず秘密文字列が空のまま次段に渡る事故が起こり得る)、
      # ここでは Secrets/Variables を一度 env 経由でシェル変数に落として
      # から判定する、より確実な方法を採る。
      - name: Check Windows code signing configuration
        id: signing
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.WINDOWS_CODESIGN_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.WINDOWS_CODESIGN_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.WINDOWS_CODESIGN_AZURE_SUBSCRIPTION_ID }}
          CODESIGN_ENDPOINT: ${{ vars.WINDOWS_CODESIGN_ENDPOINT }}
          CODESIGN_ACCOUNT_NAME: ${{ vars.WINDOWS_CODESIGN_ACCOUNT_NAME }}
          CODESIGN_CERT_PROFILE_NAME: ${{ vars.WINDOWS_CODESIGN_CERT_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ] \
             && [ -n "$CODESIGN_ENDPOINT" ] && [ -n "$CODESIGN_ACCOUNT_NAME" ] && [ -n "$CODESIGN_CERT_PROFILE_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Windows code signing is configured - binaries will be signed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Windows code signing secrets/variables are not fully configured - shipping an unsigned build. See docs/windows-code-signing.md."
          fi

      - name: Azure login (code signing)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.WINDOWS_CODESIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WINDOWS_CODESIGN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WINDOWS_CODESIGN_AZURE_SUBSCRIPTION_ID }}

      # Azure Trusted Signing (製品名は Artifact Signing に改称済みだが、
      # 公式 Action は本記事執筆時点でも azure/trusted-signing-action の
      # 系譜と azure/artifact-signing-action の両方が公開されている。ここ
      # では現行の公式 README が例示している azure/artifact-signing-action
      # を使う (docs/windows-code-signing.md 参照)。private key はサービス
      # 側の HSM に置かれたままで、CI 側には一切渡らない。
      - name: Sign Windows binaries (Azure Trusted Signing)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_CODESIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.WINDOWS_CODESIGN_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_CODESIGN_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # signtool.exe の場所探索に頼らず、PowerShell 組み込みの
      # Get-AuthenticodeSignature で署名結果を確認する。証明書が無い現状の
      # CI では `enabled=false` のため実行されず未検証 — 実際に証明書を
      # 設定した初回リリースで必ず確認すること (docs/windows-code-signing.md)。
      - name: Verify Authenticode signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          foreach ($exe in "velox.exe", "velox-bench.exe") {
            $path = "target\release\$exe"
            $sig = Get-AuthenticodeSignature -FilePath $path
            if ($sig.Status -ne "Valid") {
              throw "Authenticode signature is not valid for $path (status: $($sig.Status))"
            }
            "$exe : signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $name = "velox-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item target\release\velox.exe       "dist\$name\"
          Copy-Item target\release\velox-bench.exe "dist\$name\"
          Copy-Item README.md, LICENSE              "dist\$name\"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          Get-FileHash "dist\$name.zip" -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $name.zip"
          } | Set-Content "dist\$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: velox-windows-x86_64
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.zip.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.zip.sha256
          generate_release_notes: true
          body: |
            ${{ steps.signing.outputs.enabled == 'true' && '**Windows**: velox.exe / velox-bench.exe are Authenticode-signed.' || '**Windows**: this build is unsigned (no code-signing certificate configured yet) — verify the SHA-256 checksum below before running it.' }}

            Verifying the SHA-256 checksum: see the "Build > Windows / Linux > Release build via GitHub Actions" section of README.md.
