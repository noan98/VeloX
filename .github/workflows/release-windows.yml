name: Release (Windows)

# Windows 向けリリースビルド。2 つの起動方法がある:
#
# 1. workflow_dispatch — GitHub の Actions タブから「Run workflow」を押す
#    (どのブランチでも可)。成果物は Actions の実行ページの Artifacts
#    (`velox-windows-x86_64`) からダウンロードする。
# 2. `v*` タグの push (例: `git tag v0.1.0 && git push origin v0.1.0`)。
#    上記に加えて GitHub Release を作成し、zip を添付する。
#
# Linux 用の CI (`ci.yml`) と違い、Windows は追加のシステム依存が無い
# (WebView2 は Windows 11 / 近年の Windows 10 に同梱)。ビルドは
# `Cargo.toml` の `[profile.release]` (thin LTO + strip) をそのまま使う。
#
# Linux 向けの同種の workflow は `release-linux.yml` (最小限のビルド済み
# tarball のみ、AppImage/deb 等のネイティブパッケージ化は対象外)。
# macOS は対象外 (Issue #41 / docs/decisions.md D70 参照 — CLAUDE.md の
# OS 優先度方針に従い、本格対応は品質担保後に着手する)。
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
  # この workflow 自身を変更する PR では実際にビルドして検証する
  # (workflow_dispatch は main にマージされるまで Actions タブに現れない
  # ため、PR の段階では手動実行できない)。それ以外の PR では走らない。
  pull_request:
    paths:
      - ".github/workflows/release-windows.yml"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # タグ push 時に GitHub Release を作成するため

# 同じタグに対して release-windows.yml と release-linux.yml が同時に走ると、
# 両方が `softprops/action-gh-release` で同じ Release を作りに行って競合する
# (「無ければ作成・あれば更新」という動作のため、ほぼ同時だと両方が
# 「無い」と判断して作成しに行き、片方が失敗し得る)。
#
# そこで **タグ push のときだけ** release-linux.yml と同じ group 名を共有し、
# `cancel-in-progress: false` でキャンセルではなく直列化する。group にタグ名
# を含めるので、別タグのリリース同士は並列に走る。
#
# 一方 PR や workflow_dispatch では Release を作らないので直列化する理由が
# 無い (むしろ両 workflow の CI が不必要に待たされる)。この場合は workflow
# ごとに別の group 名にして、従来どおり並列に走らせる (docs/decisions.md D70)。
concurrency:
  group: >-
    ${{ startsWith(github.ref, 'refs/tags/v')
    && format('release-tag-{0}', github.ref)
    || format('release-windows-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build release (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # タグ push 時、`Cargo.toml` の version と一致しないタグで release を
      # 作ってしまうと、GitHub Release のタグ名と zip 内のファイル名/
      # `Cargo.toml` の version 表示がずれる (タグを打つ前に version を
      # 上げ忘れた場合に起こりうる)。ここで早期に失敗させ、
      # 「タグから再現可能なビルド」の一貫性を保証する。
      - name: Verify tag matches Cargo.toml version (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $cargoVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($tagVersion -ne $cargoVersion) {
            throw "tag v$tagVersion does not match Cargo.toml version $cargoVersion"
          }
          "tag v$tagVersion matches Cargo.toml version $cargoVersion"

      - name: Build (release)
        run: cargo build --release --locked

      # velox には `--help` のような「ウィンドウを開かずに終了する」引数が
      # 無いため、ここではビルド成果物の存在とサイズだけを確認する
      # (ヘッドレスなランナーで GUI を起動しても検証にならない)。
      - name: Verify build outputs
        shell: pwsh
        run: |
          foreach ($exe in "velox.exe", "velox-bench.exe") {
            $path = "target\release\$exe"
            if (-not (Test-Path $path)) { throw "missing: $path" }
            $size = (Get-Item $path).Length
            if ($size -lt 100KB) { throw "suspiciously small: $path ($size bytes)" }
            "$exe : $size bytes"
          }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $name = "velox-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item target\release\velox.exe       "dist\$name\"
          Copy-Item target\release\velox-bench.exe "dist\$name\"
          Copy-Item README.md, LICENSE              "dist\$name\"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          Get-FileHash "dist\$name.zip" -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $name.zip"
          } | Set-Content "dist\$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: velox-windows-x86_64
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.zip.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}.zip.sha256
          generate_release_notes: true
