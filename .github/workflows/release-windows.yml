name: Release (Windows)

# Windows 向けリリースビルド。
#
# 1. workflow_dispatch — GitHub の Actions タブから手動実行可能。
# 2. `v*` タグの push — GitHub Release に Windows インストーラを添付。
#
# Windows の配布物は ZIP / 生 EXE ではなく Inno Setup のインストーラ
# (`*-setup.exe`) だけを生成する。
#
# コード署名 (Issue #42 / docs/decisions.md D73): 下記 6 つの Secrets /
# Variables が揃っている場合のみ Azure Artifact Signing で Authenticode
# 署名を行う。未設定なら無署名でビルドを継続する。
#   - secrets.WINDOWS_CODESIGN_AZURE_CLIENT_ID
#   - secrets.WINDOWS_CODESIGN_AZURE_TENANT_ID
#   - secrets.WINDOWS_CODESIGN_AZURE_SUBSCRIPTION_ID
#   - vars.WINDOWS_CODESIGN_ENDPOINT
#   - vars.WINDOWS_CODESIGN_ACCOUNT_NAME
#   - vars.WINDOWS_CODESIGN_CERT_PROFILE_NAME
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release-windows.yml"
      - "installer/windows/**"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

concurrency:
  group: >-
    ${{ startsWith(github.ref, 'refs/tags/v')
    && format('release-tag-{0}', github.ref)
    || format('release-windows-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build release (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Verify tag matches Cargo.toml version (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $cargoVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($tagVersion -ne $cargoVersion) {
            throw "tag v$tagVersion does not match Cargo.toml version $cargoVersion"
          }
          "tag v$tagVersion matches Cargo.toml version $cargoVersion"

      - name: Build (release)
        run: cargo build --release --locked

      - name: Verify build outputs
        shell: pwsh
        run: |
          foreach ($exe in "velox.exe", "velox-bench.exe") {
            $path = "target\release\$exe"
            if (-not (Test-Path $path)) { throw "missing: $path" }
            $size = (Get-Item $path).Length
            if ($size -lt 100KB) { throw "suspiciously small: $path ($size bytes)" }
            "$exe : $size bytes"
          }

      - name: Check Windows code signing configuration
        id: signing
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.WINDOWS_CODESIGN_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.WINDOWS_CODESIGN_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.WINDOWS_CODESIGN_AZURE_SUBSCRIPTION_ID }}
          CODESIGN_ENDPOINT: ${{ vars.WINDOWS_CODESIGN_ENDPOINT }}
          CODESIGN_ACCOUNT_NAME: ${{ vars.WINDOWS_CODESIGN_ACCOUNT_NAME }}
          CODESIGN_CERT_PROFILE_NAME: ${{ vars.WINDOWS_CODESIGN_CERT_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ] \
             && [ -n "$CODESIGN_ENDPOINT" ] && [ -n "$CODESIGN_ACCOUNT_NAME" ] && [ -n "$CODESIGN_CERT_PROFILE_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Windows code signing is configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Windows code signing is not fully configured; continuing with an unsigned build."
          fi

      - name: Azure login (code signing)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f
        with:
          client-id: ${{ secrets.WINDOWS_CODESIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WINDOWS_CODESIGN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WINDOWS_CODESIGN_AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30
        with:
          endpoint: ${{ vars.WINDOWS_CODESIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.WINDOWS_CODESIGN_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_CODESIGN_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          foreach ($exe in "velox.exe", "velox-bench.exe") {
            $path = "target\release\$exe"
            $sig = Get-AuthenticodeSignature -FilePath $path
            if ($sig.Status -ne "Valid") {
              throw "Authenticode signature is not valid for $path (status: $($sig.Status))"
            }
            "$exe : signed by $($sig.SignerCertificate.Subject)"
          }

      # Inno Setup で、ユーザーがそのまま実行できる Windows インストーラを生成する。
      # velox-bench.exe は開発/ベンチマーク用なので製品インストーラには含めない。
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=$version" "installer\windows\velox.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = "dist\velox-$version-windows-x86_64-setup.exe"
          if (-not (Test-Path $installer)) { throw "installer not found: $installer" }
          $size = (Get-Item $installer).Length
          if ($size -lt 100KB) { throw "installer is suspiciously small: $installer ($size bytes)" }
          "name=velox-$version-windows-x86_64-setup.exe" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT
          Get-Item $installer | Select-Object FullName, Length

      # 配布物そのものにも署名する。バイナリ署名が有効な場合のみ実行。
      - name: Sign Windows installer
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c0ae2c1d0c1847ab81ac0ab8521bee597cfedd30
        with:
          endpoint: ${{ vars.WINDOWS_CODESIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.WINDOWS_CODESIGN_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_CODESIGN_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify installer signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $path = "${{ steps.package.outputs.installer }}"
          $sig = Get-AuthenticodeSignature -FilePath $path
          if ($sig.Status -ne "Valid") {
            throw "Authenticode signature is not valid for $path (status: $($sig.Status))"
          }
          "$path : signed by $($sig.SignerCertificate.Subject)"

      # Actions artifact も GitHub Release も、Windows はインストーラだけ。
      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: velox-windows-x86_64-installer
          path: ${{ steps.package.outputs.installer }}
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b
        with:
          files: ${{ steps.package.outputs.installer }}
          generate_release_notes: true
          body: |
            ${{ steps.signing.outputs.enabled == 'true' && '**Windows**: the installer is Authenticode-signed.' || '**Windows**: the installer is currently unsigned because code-signing credentials are not configured.' }}
